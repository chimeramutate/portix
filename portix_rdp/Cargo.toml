[package]
name = "portix-rdp"
version = "0.1.0"
edition = "2024"

[lib]
name = "portix_rdp"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# IronRDP core
ironrdp-connector = "0.10"
ironrdp-session   = "0.11"
ironrdp-async     = "0.10"
ironrdp-tokio     = "0.10"
ironrdp-input     = "0.7"
ironrdp-pdu       = "0.9"
ironrdp-tls       = { version = "0.2", features = ["rustls-ring"] }

# Runtime & utilities
tokio    = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
anyhow   = "1"
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid     = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
flutter_rust_bridge = "=2.11.1"
