[package]
name = "portix-rdp"
version = "0.1.0"
edition = "2024"

[lib]
name = "portix_rdp"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "portix-rdp"
path = "src/main.rs"



[dependencies]
# ── IronRDP ────────────────────────────────────────────────────────────────
ironrdp-graphics = "0.9"
ironrdp-tokio = { version = "0.10", features = ["reqwest"] }
ironrdp-connector = "0.10"
ironrdp-session   = "0.11"
ironrdp-async     = "0.10"
ironrdp-input     = "0.7"
ironrdp-pdu       = "0.9"
ironrdp-tls       = { version = "0.2", features = ["rustls-ring"] }

# RDP device / drive redirection

ironrdp-rdpdr = "0.7"
ironrdp-rdpdr-native = "0.7"


# ── Network ────────────────────────────────────────────────────────────────
reqwest = "0.12"
url = "2"

# ── Runtime & utilities ───────────────────────────────────────────────────
tokio      = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
tokio-util = "0.7" 
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
uuid       = { version = "1", features = ["v4", "serde"] }
once_cell  = "1"
base64     = "0.22"

# ── Flutter bridge ─────────────────────────────────────────────────────────
flutter_rust_bridge = "=2.11.1"

# ── PNG encoding (for test binary only) ───────────────────────────────────
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
png = "0.17"
minifb = "0.27"

image = { version = "0.25", default-features = false, features = ["png"] }

# Logging used by IronRDP/RDPDR
tracing = "0.1"