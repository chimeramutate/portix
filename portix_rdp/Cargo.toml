[package]
name = "portix-rdp"
version = "0.1.0"
edition = "2024"

[lib]
name = "portix_rdp"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]

# ============================================================================
# Flutter Rust Bridge
# ============================================================================
flutter_rust_bridge = { version = "2.13.0", features = ["user-utils"] }

# ============================================================================
# Error handling
# ============================================================================
anyhow = "1"
thiserror = "2"

# ============================================================================
# Async runtime
# ============================================================================
tokio = {
    version = "1",
    features = [
        "macros",
        "rt",
        "rt-multi-thread",
        "sync",
        "time",
        "net",
        "io-util",
        "signal"
    ]
}

tokio-util = "0.7"

# ============================================================================
# Serialization
# ============================================================================
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ============================================================================
# Utility
# ============================================================================
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
base64 = "0.22"
hostname = "0.4"
url = "2"

# ============================================================================
# Network
# ============================================================================
reqwest = "0.12"

# ============================================================================
# IronRDP
# ============================================================================

ironrdp-core = "0.2"
ironrdp-graphics = "0.9"

ironrdp-tokio = {
    version = "0.10",
    features = ["reqwest"]
}

ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-async = "0.10"
ironrdp-input = "0.7"
ironrdp-pdu = "0.9"

ironrdp-tls = {
    version = "0.2",
    features = ["rustls-ring"]
}

ironrdp-svc = "0.8"

# RDP device / drive redirection
ironrdp-rdpdr = "0.7"

# ============================================================================
# Logging
# ============================================================================
tracing = "0.1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]

ironrdp-rdpdr-native = "0.7"

nix = {
    version = "0.31",
    features = [
        "fs",
        "dir"
    ]
}

tracing-subscriber = {
    version = "0.3",
    features = ["env-filter"]
}

# ============================================================================
# Desktop / image support
# ============================================================================
[target.'cfg(not(target_os = "android"))'.dependencies]

png = "0.17"

minifb = "0.27"

image = {
    version = "0.25",
    default-features = false,
    features = ["png"]
}

# ============================================================================
# Development dependencies
# ============================================================================
[dev-dependencies]

tokio = {
    version = "1",
    features = [
        "macros",
        "rt",
        "rt-multi-thread",
        "sync",
        "time"
    ]
}

# ============================================================================
# Release
# ============================================================================
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = false

# ============================================================================
# Hardened release
# ============================================================================
[profile.release-hardened]
inherits = "release"
strip = "debuginfo"