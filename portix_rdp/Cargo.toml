[package]
name = "portix-rdp"
version = "0.1.0"
edition = "2024"

[lib]
name = "portix_rdp"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.13.0", features = ["user-utils"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
hostname = "0.4"

# IronRDP
ironrdp-core = "0.2"
ironrdp-graphics = "0.9"
ironrdp-tokio = { version = "0.10", features = ["reqwest"] }
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-input = "0.7"
ironrdp-pdu = "0.9"
ironrdp-tls = { version = "0.2", features = ["rustls-ring"] }
ironrdp-svc = "0.8"
ironrdp-rdpdr = "0.7"
ironrdp-cliprdr = "0.7"
# OS clipboard for cliprdr text sync
arboard = "3.6"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
ironrdp-rdpdr-native = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = false

[profile.release-hardened]
inherits = "release"
strip = "debuginfo"
