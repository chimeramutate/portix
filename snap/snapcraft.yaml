name: portix
version: "1.0.0"
summary: Portix SSH Client - Multi-platform SSH terminal with SFTP
description: |
  Portix is a modern SSH client built with Flutter UI and Rust SSH core.
  Features include multi-tab terminal sessions, split workspace, SFTP file
  manager, remote file browsing, command autocomplete, and cross-platform
  support for Linux, macOS, and Windows.

icon: portix_app/assets/icons/portix_launcher.png

base: core22
grade: stable
confinement: strict

architectures:
  - build-on: amd64

parts:
  portix:
    plugin: nil
    source: .
    source-type: local
    stage-packages:
      - libgtk-3-0
      - libsecret-1-0
      - libgcrypt20
      - wget  # needed for downloading bundle
    override-build: |
      echo "Starting bundle copy..."
      
      # Check for bundle in source directory first (for local/artifact staging)
      if [ -d "./bundle" ]; then
        echo "Found bundle in ./bundle, copying..."
        cp -r ./bundle/. $CRAFT_PART_INSTALL/
        echo "Bundle copied successfully"
        ls -la $CRAFT_PART_INSTALL/
        exit 0
      fi
      
      # Fall back to /tmp/artifact/bundle for compatibility
      if [ -d "/tmp/artifact/bundle" ]; then
        echo "Found bundle in /tmp/artifact/bundle, copying..."
        cp -r /tmp/artifact/bundle/. $CRAFT_PART_INSTALL/
        echo "Bundle copied successfully"
        ls -la $CRAFT_PART_INSTALL/
        exit 0
      fi
      
      echo "ERROR: Pre-built bundle not found!"
      echo "Looked in: ./bundle and /tmp/artifact/bundle"
      exit 1

apps:
  portix:
    command: portix
    desktop: usr/share/applications/portix.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - gsettings
      - password-manager-service
      - ssh-keys

layout:
  /usr/share/libdrm:
    bind: $SNAP/usr/share/libdrm