name: Build Windows

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch:
          - x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          architecture: ${{ matrix.arch }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: |
          choco install nsis -y

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path:
            - ~/.pub-cache
          key: ${{ runner.OS }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.OS }}-pub-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/portix_serv/target
          key: ${{ runner.OS }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.OS }}-cargo-

      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          # Get version from tag or use default
          $refName = '${{ github.ref_name }}'
          if ($refName -match '^v(.+)') {
            $VERSION = $Matches[1]
          } else {
            $VERSION = $refName
          }
          if (-not $VERSION) { $VERSION = '0.0.0-dev' }
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $VERSION"

      - name: Build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          
          # Make scripts executable
          chmod +x packaging/windows/build_windows.sh
          
          # Run build
          .\packaging\windows\build_windows.bat ${{ steps.get_version.outputs.version }}

      - name: Build NSIS Installer
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $VERSION = "${{ steps.get_version.outputs.version }}"
          
          # Copy NSI script to build output
          $BUILD_OUTPUT = "dist\windows\portix-$VERSION-win-x64"
          $NSI_SCRIPT = "packaging\windows\portix-installer.nsi"
          
          # Note: NSIS installer compilation
          # The installer needs manual setup or custom NSI modifications
          # For now, we just prepare the files
          
          Write-Host "NSIS installer script available at: $NSI_SCRIPT"
          Write-Host "To build installer manually:"
          Write-Host "  1. Extract $BUILD_OUTPUT\portix-$VERSION-win-x64.zip"
          Write-Host "  2. Copy files from extracted folder to Release/"
          Write-Host "  3. Run: makensis $NSI_SCRIPT"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portix-${{ steps.get_version.outputs.version }}-windows
          path: dist/windows/portix-${{ steps.get_version.outputs.version }}-win-x64.zip
          if-no-files-found: error

      - name: Upload Checksum Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portix-${{ steps.get_version.outputs.version }}-windows-checksum
          path: dist/windows/*.sha256
          if-no-files-found: error

      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags')
        uses: softprops/action-gh-release@v2
        with:
          name: Portix ${{ steps.get_version.outputs.version }}
          body: |
            ## Portix ${{ steps.get_version.outputs.version }}
            
            ### Features
            - Multi-tab terminal sessions
            - Split workspace
            - Built-in SFTP file manager
            - Remote file browsing
            - Command autocomplete
            - Native Rust SSH engine
            
            ### Download
            - [Windows](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/portix-${{ steps.get_version.outputs.version }}-win-x64.zip)
          files: |
            dist/windows/portix-${{ steps.get_version.outputs.version }}-win-x64.zip
            dist/windows/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}