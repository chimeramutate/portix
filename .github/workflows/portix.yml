name: Build & Release

on:
  push:
    branches:
      - main
      - develop
      - staging
      - "release/**"
    tags:
      - "v*.*.*"
      - "v*.*.*-beta*"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "beta"
        type: choice
        options:
          - stable
          - beta
          - development

permissions:
  contents: write
  pull-requests: read

env:
  IS_BETA: ${{ contains(github.ref_name, '-beta') || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'beta') || (github.event_name == 'push' && github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/')) }}
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
  IS_MAIN_BRANCH: ${{ github.ref_name == 'main' }}
  BRANCH_NAME: ${{ github.ref_name }}

  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

  SERV_DIR: portix_serv
  RDP_DIR: portix_rdp
  APP_DIR: portix_app

jobs:
  validate-rust:
    name: "Validate Rust [PR]"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    concurrency:
      group: validate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            portix_serv
            portix_rdp
          key: pr-check

      - name: Check portix_serv
        working-directory: portix_serv
        run: cargo check --all-features

      - name: Test portix_serv
        working-directory: portix_serv
        run: cargo test --lib --all-features

      - name: Check portix_rdp
        working-directory: portix_rdp
        run: cargo check --all-features

      - name: Test portix_rdp
        working-directory: portix_rdp
        run: cargo test --lib --all-features

  build-rust-macos:
    name: "Rust Libraries [macOS] @ ${{ github.ref_name }}"
    runs-on: macos-latest
    if: github.event_name != 'pull_request'

    concurrency:
      group: build-rust-macos-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            portix_serv
            portix_rdp
          key: macos

      - name: Build portix_serv
        working-directory: ${{ env.SERV_DIR }}
        shell: bash
        run: cargo build --profile release-hardened

      - name: Build portix_rdp
        working-directory: ${{ env.RDP_DIR }}
        shell: bash
        run: cargo build --profile release-hardened

      - name: Verify and prepare macOS server library
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find "${SERV_DIR}/target" -type f -name "libportix_serv.dylib" | head -n 1)
          test -n "$FILE"
          strip -x "$FILE" || true
          rm -rf dist-serv
          mkdir -p dist-serv
          cp "$FILE" dist-serv/libportix_serv.dylib
          ls -lah dist-serv/

      - name: Verify and prepare macOS RDP library
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find "${RDP_DIR}/target" -type f -name "libportix_rdp.dylib" | head -n 1)
          test -n "$FILE"
          strip -x "$FILE" || true
          rm -rf dist-rdp
          mkdir -p dist-rdp
          cp "$FILE" dist-rdp/libportix_rdp.dylib
          ls -lah dist-rdp/

      - name: Trivy scan - macOS server library
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: dist-serv/
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Trivy scan - macOS RDP library
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: dist-rdp/
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload macOS server library
        uses: actions/upload-artifact@v7
        with:
          name: macos-lib
          path: dist-serv/libportix_serv.dylib
          if-no-files-found: error

      - name: Upload macOS RDP library
        uses: actions/upload-artifact@v7
        with:
          name: macos-rdp-lib
          path: dist-rdp/libportix_rdp.dylib
          if-no-files-found: error

  build-rust-linux:
    name: "Rust Libraries [Linux] @ ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    concurrency:
      group: build-rust-linux-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            portix_serv
            portix_rdp
          key: linux

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libgcrypt20-dev \
            libssl-dev

      - name: Build portix_serv
        working-directory: ${{ env.SERV_DIR }}
        shell: bash
        run: cargo build --profile release-hardened

      - name: Build portix_rdp
        working-directory: ${{ env.RDP_DIR }}
        shell: bash
        run: cargo build --profile release-hardened

      - name: Verify and prepare Linux server library
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find "${SERV_DIR}/target" -type f -name "libportix_serv.so" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: libportix_serv.so not found"
            exit 1
          fi
          strip --strip-all "$FILE" || true
          rm -rf dist-serv
          mkdir -p dist-serv
          cp "$FILE" dist-serv/libportix_serv.so
          ls -lah dist-serv/

      - name: Verify and prepare Linux RDP library
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find "${RDP_DIR}/target" -type f -name "libportix_rdp.so" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: libportix_rdp.so not found"
            exit 1
          fi
          strip --strip-all "$FILE" || true
          rm -rf dist-rdp
          mkdir -p dist-rdp
          cp "$FILE" dist-rdp/libportix_rdp.so
          ls -lah dist-rdp/

      - name: Trivy scan - Linux server library
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: dist-serv/
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Trivy scan - Linux RDP library
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: dist-rdp/
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Linux server library
        uses: actions/upload-artifact@v7
        with:
          name: linux-lib
          path: dist-serv/libportix_serv.so
          if-no-files-found: error

      - name: Upload Linux RDP library
        uses: actions/upload-artifact@v7
        with:
          name: linux-rdp-lib
          path: dist-rdp/libportix_rdp.so
          if-no-files-found: error

  build-rust-windows:
    name: "Rust Libraries [Windows] @ ${{ github.ref_name }}"
    runs-on: windows-latest
    if: github.event_name != 'pull_request'

    concurrency:
      group: build-rust-windows-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            portix_serv
            portix_rdp
          key: windows

      - name: Build portix_serv
        working-directory: ${{ env.SERV_DIR }}
        shell: pwsh
        run: cargo build --profile release-hardened

      - name: Build portix_rdp
        working-directory: ${{ env.RDP_DIR }}
        shell: pwsh
        run: cargo build --profile release-hardened

      - name: Prepare Windows server library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = Get-ChildItem -Path "${{ env.SERV_DIR }}/target" -Filter "portix_serv.dll" -File -Recurse | Select-Object -First 1
          if ($null -eq $file) { throw "Windows server library not found" }
          Remove-Item -Path "dist-serv" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "dist-serv" -Force | Out-Null
          Copy-Item $file.FullName "dist-serv/portix_serv.dll" -Force
          Get-ChildItem dist-serv

      - name: Prepare Windows RDP library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = Get-ChildItem -Path "${{ env.RDP_DIR }}/target" -Filter "portix_rdp.dll" -File -Recurse | Select-Object -First 1
          if ($null -eq $file) { throw "Windows RDP library not found" }
          Remove-Item -Path "dist-rdp" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "dist-rdp" -Force | Out-Null
          Copy-Item $file.FullName "dist-rdp/portix_rdp.dll" -Force
          Get-ChildItem dist-rdp

      - name: Trivy scan - Windows server library
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: dist-serv/
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Trivy scan - Windows RDP library
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: dist-rdp/
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Windows server library
        uses: actions/upload-artifact@v7
        with:
          name: windows-lib
          path: dist-serv/portix_serv.dll
          if-no-files-found: error

      - name: Upload Windows RDP library
        uses: actions/upload-artifact@v7
        with:
          name: windows-rdp-lib
          path: dist-rdp/portix_rdp.dll
          if-no-files-found: error

  build-desktop-macos:
    name: "Desktop [macOS] @ ${{ github.ref_name }}"
    runs-on: macos-latest
    needs: [build-rust-macos]
    if: github.event_name != 'pull_request'

    concurrency:
      group: build-desktop-macos-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download macOS server library
        uses: actions/download-artifact@v7
        with:
          name: macos-lib
          path: portix_serv_lib

      - name: Download macOS RDP library
        uses: actions/download-artifact@v7
        with:
          name: macos-rdp-lib
          path: portix_rdp_lib

      - name: Verify native libraries
        shell: bash
        run: |
          set -euo pipefail
          test -f portix_serv_lib/libportix_serv.dylib
          test -f portix_rdp_lib/libportix_rdp.dylib
          ls -lah portix_serv_lib/libportix_serv.dylib
          ls -lah portix_rdp_lib/libportix_rdp.dylib

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Verify Flutter Rust Bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          dart_file = Path("portix_app/lib/src/rust/frb_generated.dart")
          rust_file = Path("portix_serv/src/frb_generated.rs")

          for path in (dart_file, rust_file):
              if not path.exists():
                  print(f"ERROR: generated file not found: {path}")
                  sys.exit(1)

          dart_text = dart_file.read_text(encoding="utf-8")
          rust_text = rust_file.read_text(encoding="utf-8")

          dart_hash = None
          rust_hash = None

          for pattern in [
              r"rustContentHash\s*=>\s*(-?\d+)",
              r"rustContentHash\s*=\s*(-?\d+)",
          ]:
              match = re.search(pattern, dart_text)
              if match:
                  dart_hash = match.group(1)
                  break

          for pattern in [
              r"FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH\s*:\s*i32\s*=\s*(-?\d+)",
              r"FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH\s*=\s*(-?\d+)",
          ]:
              match = re.search(pattern, rust_text)
              if match:
                  rust_hash = match.group(1)
                  break

          print(f"Dart content hash: {dart_hash or ''}")
          print(f"Rust content hash: {rust_hash or ''}")

          if dart_hash is None or rust_hash is None:
              print("ERROR: Could not find both Flutter Rust Bridge content hashes")
              sys.exit(1)

          if dart_hash != rust_hash:
              print("ERROR: Dart/Rust Bridge content hash mismatch")
              sys.exit(1)

          print("Bridge hashes match")
          PY

      - name: Build Flutter macOS
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build macos \
            --release \
            --dart-define=PORTIX_BACKEND=rust \
            --dart-define=RUST_LIBRARY_MODE=production

      - name: Bundle Rust libraries
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "${APP_DIR}/build/macos/Build/Products/Release" -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$APP_PATH"
          MACOS_DIR="$APP_PATH/Contents/MacOS"

          cp portix_serv_lib/libportix_serv.dylib "$MACOS_DIR/"
          cp portix_rdp_lib/libportix_rdp.dylib "$MACOS_DIR/"

          codesign --force --sign - "$MACOS_DIR/libportix_serv.dylib"
          codesign --force --sign - "$MACOS_DIR/libportix_rdp.dylib"
          codesign --force --deep --sign - "$APP_PATH"

          ls -lah "$MACOS_DIR"

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' "${APP_DIR}/pubspec.yaml" | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Package macOS
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "${APP_DIR}/build/macos/Build/Products/Release" -maxdepth 1 -name "*.app" -type d | head -n 1)
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_NAME="${{ github.ref_name }}-${VERSION}"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "portix-macos-${RELEASE_NAME}.zip"
          ls -lah "portix-macos-${RELEASE_NAME}.zip"

      - name: Upload macOS desktop
        uses: actions/upload-artifact@v7
        with:
          name: portix-macos-${{ github.ref_name }}-${{ steps.version.outputs.version }}
          path: portix-macos-${{ github.ref_name }}-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  build-desktop-linux:
    name: "Desktop [Linux] @ ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    needs: [build-rust-linux]
    if: github.event_name != 'pull_request'

    outputs:
      app_version: ${{ steps.version.outputs.version }}
      release_name: ${{ steps.version.outputs.release_name }}

    concurrency:
      group: build-desktop-linux-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux server library
        uses: actions/download-artifact@v7
        with:
          name: linux-lib
          path: portix_serv_lib

      - name: Download Linux RDP library
        uses: actions/download-artifact@v7
        with:
          name: linux-rdp-lib
          path: portix_rdp_lib

      - name: Verify native libraries
        shell: bash
        run: |
          set -euo pipefail
          SERV="portix_serv_lib/libportix_serv.so"
          RDP="portix_rdp_lib/libportix_rdp.so"

          if [ ! -f "$SERV" ]; then
            echo "ERROR: Linux server library not found: $SERV"
            exit 1
          fi

          if [ ! -f "$RDP" ]; then
            echo "ERROR: Linux RDP library not found: $RDP"
            exit 1
          fi

          ls -lah "$SERV"
          ls -lah "$RDP"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux Flutter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libgcrypt20-dev \
            libssl-dev

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' "${APP_DIR}/pubspec.yaml" | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine version from ${APP_DIR}/pubspec.yaml"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "ERROR: Invalid application version: $VERSION"
            echo "Expected something like 1.0.1"
            exit 1
          fi

          RELEASE_NAME="${{ github.ref_name }}-${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

          echo "Branch: ${{ github.ref_name }}"
          echo "Application version: $VERSION"
          echo "Release name: $RELEASE_NAME"

      - name: Verify Flutter Rust Bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          dart_file = Path("portix_app/lib/src/rust/frb_generated.dart")
          rust_file = Path("portix_serv/src/frb_generated.rs")

          for path in (dart_file, rust_file):
              if not path.exists():
                  print(f"ERROR: generated file not found: {path}")
                  sys.exit(1)

          dart_text = dart_file.read_text(encoding="utf-8")
          rust_text = rust_file.read_text(encoding="utf-8")

          dart_hash = None
          rust_hash = None

          for pattern in [
              r"rustContentHash\s*=>\s*(-?\d+)",
              r"rustContentHash\s*=\s*(-?\d+)",
          ]:
              match = re.search(pattern, dart_text)
              if match:
                  dart_hash = match.group(1)
                  break

          for pattern in [
              r"FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH\s*:\s*i32\s*=\s*(-?\d+)",
              r"FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH\s*=\s*(-?\d+)",
          ]:
              match = re.search(pattern, rust_text)
              if match:
                  rust_hash = match.group(1)
                  break

          print(f"Dart content hash: {dart_hash or ''}")
          print(f"Rust content hash: {rust_hash or ''}")

          if dart_hash is None or rust_hash is None:
              print("ERROR: Could not find both Flutter Rust Bridge content hashes")
              sys.exit(1)

          if dart_hash != rust_hash:
              print("ERROR: Dart/Rust Bridge content hash mismatch")
              sys.exit(1)

          print("Bridge hashes match")
          PY

      - name: Build Flutter Linux
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build linux \
            --release \
            --dart-define=PORTIX_BACKEND=rust \
            --dart-define=RUST_LIBRARY_MODE=production

      - name: Bundle Rust libraries
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_DIR="${APP_DIR}/build/linux/x64/release/bundle"

          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "ERROR: Linux bundle not found: $BUNDLE_DIR"
            exit 1
          fi

          SERV="portix_serv_lib/libportix_serv.so"
          RDP="portix_rdp_lib/libportix_rdp.so"

          test -f "$SERV"
          test -f "$RDP"

          # Keep both native libraries directly next to the Flutter executable.
          cp "$SERV" "$BUNDLE_DIR/libportix_serv.so"
          cp "$RDP" "$BUNDLE_DIR/libportix_rdp.so"

          chmod +x "$BUNDLE_DIR/libportix_serv.so"
          chmod +x "$BUNDLE_DIR/libportix_rdp.so"

          echo "Rust libraries bundled:"
          ls -lah \
            "$BUNDLE_DIR/libportix_serv.so" \
            "$BUNDLE_DIR/libportix_rdp.so"

      - name: Verify Linux bundle
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_DIR="${APP_DIR}/build/linux/x64/release/bundle"

          for file in \
            "$BUNDLE_DIR/portix" \
            "$BUNDLE_DIR/libportix_serv.so" \
            "$BUNDLE_DIR/libportix_rdp.so"
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required bundle file missing: $file"
              exit 1
            fi
          done

          echo "Linux bundle is complete:"
          ls -lah \
            "$BUNDLE_DIR/portix" \
            "$BUNDLE_DIR/libportix_serv.so" \
            "$BUNDLE_DIR/libportix_rdp.so"

      - name: Bundle Linux runtime libraries
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_DIR="${APP_DIR}/build/linux/x64/release/bundle"
          BUNDLE_LIB="$BUNDLE_DIR/lib"
          mkdir -p "$BUNDLE_LIB"

          for lib in libsecret-1.so.0 libgcrypt.so.20; do
            LIB_PATH=$(
              ldconfig -p 2>/dev/null |
              grep -m1 -F "$lib" |
              awk '{print $NF}'
            )

            if [ -n "$LIB_PATH" ] && [ -f "$LIB_PATH" ]; then
              cp "$LIB_PATH" "$BUNDLE_LIB/$lib"
              echo "Bundled $lib from $LIB_PATH"
            else
              echo "Warning: Could not locate $lib"
            fi
          done

      - name: Package Linux TAR
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_NAME="${{ steps.version.outputs.release_name }}"
          ARCHIVE="portix-linux-${RELEASE_NAME}.tar.gz"

          tar \
            -czf "$ARCHIVE" \
            -C "${APP_DIR}/build/linux/x64/release" \
            bundle

          ls -lah "$ARCHIVE"

      - name: Package Linux DEB
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"

          if [ ! -f "packaging/linux/build-deb.sh" ]; then
            echo "ERROR: packaging/linux/build-deb.sh not found"
            exit 1
          fi

          chmod +x packaging/linux/build-deb.sh

          bash packaging/linux/build-deb.sh "$VERSION"

          DEB_FILE="${APP_DIR}/build/linux/deb/portix_${VERSION}_amd64.deb"

          if [ ! -f "$DEB_FILE" ]; then
            echo "ERROR: DEB was not created: $DEB_FILE"
            exit 1
          fi

          echo "DEB created:"
          ls -lah "$DEB_FILE"

      - name: Verify DEB contents
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          DEB_FILE="${APP_DIR}/build/linux/deb/portix_${VERSION}_amd64.deb"

          dpkg-deb --info "$DEB_FILE"
          echo ""
          echo "Checking Rust libraries inside DEB..."

          dpkg-deb --contents "$DEB_FILE" | grep -E \
            'opt/portix/libportix_(serv|rdp)\.so$'

      - name: Upload Linux desktop
        uses: actions/upload-artifact@v7
        with:
          name: portix-Linux-${{ steps.version.outputs.release_name }}
          path: |
            portix-linux-${{ steps.version.outputs.release_name }}.tar.gz
            portix_app/build/linux/deb/portix_${{ steps.version.outputs.version }}_amd64.deb
          if-no-files-found: error

  build-desktop-windows:
    name: "Desktop [Windows] @ ${{ github.ref_name }}"
    runs-on: windows-latest
    needs: [build-rust-windows]
    if: github.event_name != 'pull_request'

    concurrency:
      group: build-desktop-windows-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows server library
        uses: actions/download-artifact@v7
        with:
          name: windows-lib
          path: portix_serv_lib

      - name: Download Windows RDP library
        uses: actions/download-artifact@v7
        with:
          name: windows-rdp-lib
          path: portix_rdp_lib

      - name: Verify native libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $serv = "portix_serv_lib/portix_serv.dll"
          $rdp = "portix_rdp_lib/portix_rdp.dll"
          if (-not (Test-Path $serv)) { throw "Windows server library not found: $serv" }
          if (-not (Test-Path $rdp)) { throw "Windows RDP library not found: $rdp" }
          Get-Item $serv | Format-List Name, Length
          Get-Item $rdp | Format-List Name, Length

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Verify Flutter Rust Bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import re
          import sys
          from pathlib import Path

          dart_file = Path("portix_app/lib/src/rust/frb_generated.dart")
          rust_file = Path("portix_serv/src/frb_generated.rs")

          for path in (dart_file, rust_file):
              if not path.exists():
                  print(f"ERROR: generated file not found: {path}")
                  sys.exit(1)

          dart_text = dart_file.read_text(encoding="utf-8")
          rust_text = rust_file.read_text(encoding="utf-8")

          dart_hash = None
          rust_hash = None

          for pattern in [
              r"rustContentHash\s*=>\s*(-?\d+)",
              r"rustContentHash\s*=\s*(-?\d+)",
          ]:
              match = re.search(pattern, dart_text)
              if match:
                  dart_hash = match.group(1)
                  break

          for pattern in [
              r"FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH\s*:\s*i32\s*=\s*(-?\d+)",
              r"FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH\s*=\s*(-?\d+)",
          ]:
              match = re.search(pattern, rust_text)
              if match:
                  rust_hash = match.group(1)
                  break

          print(f"Dart content hash: {dart_hash or ''}")
          print(f"Rust content hash: {rust_hash or ''}")

          if dart_hash is None or rust_hash is None:
              print("ERROR: Could not find both Flutter Rust Bridge content hashes")
              sys.exit(1)

          if dart_hash != rust_hash:
              print("ERROR: Dart/Rust Bridge content hash mismatch")
              sys.exit(1)

          print("Bridge hashes match")
          '@ | python -

      - name: Resolve application version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $line = Get-Content "${{ env.APP_DIR }}/pubspec.yaml" |
            Where-Object { $_ -match '^version:\s*' } |
            Select-Object -First 1

          if (-not $line) {
            throw "Could not determine version from pubspec.yaml"
          }

          $version = ($line -replace '^version:\s*', '').Trim()
          $version = $version.Split('+')[0]

          if ($version -notmatch '^\d+(\.\d+){0,3}$') {
            throw "Invalid application version: $version"
          }

          $releaseName = "${{ github.ref_name }}-$version"

          "version=$version" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT

          Write-Host "Application version: $version"
          Write-Host "Release name: $releaseName"

      - name: Build Flutter Windows
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter build windows `
            --release `
            --dart-define=PORTIX_BACKEND=rust `
            --dart-define=RUST_LIBRARY_MODE=production

      - name: Bundle Rust libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $serv = "portix_serv_lib/portix_serv.dll"
          $rdp = "portix_rdp_lib/portix_rdp.dll"
          $dst = "portix_app/build/windows/x64/runner/Release"

          if (-not (Test-Path $dst)) {
            throw "Windows release directory not found: $dst"
          }

          Copy-Item $serv $dst -Force
          Copy-Item $rdp $dst -Force

          Get-Item "$dst/portix_serv.dll"
          Get-Item "$dst/portix_rdp.dll"

      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "portix_app/build/windows/x64/runner/Release/*"
          $destination = "portix-windows-${{ steps.version.outputs.release_name }}.zip"

          Compress-Archive -Path $source -DestinationPath $destination -Force
          Get-Item $destination | Format-List Name, Length

      - name: Upload Windows desktop
        uses: actions/upload-artifact@v7
        with:
          name: portix-Windows-${{ steps.version.outputs.release_name }}
          path: portix-windows-${{ steps.version.outputs.release_name }}.zip
          if-no-files-found: error

  release-desktop:
    name: "Release Desktop to GitHub"
    runs-on: ubuntu-latest
    needs:
      - build-desktop-macos
      - build-desktop-linux
      - build-desktop-windows

    if: always() && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download available desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: portix-*
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: List available desktop artifacts
        shell: bash
        run: |
          echo "Available desktop artifacts:"
          if [ -d artifacts ]; then
            find artifacts -type f -print
          else
            echo "No desktop artifacts directory"
          fi

      - name: Check desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          if [ -d artifacts ]; then
            COUNT=$(find artifacts -type f | wc -l)
          fi
          echo "Desktop artifact count: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No desktop artifacts were produced"
            exit 1
          fi

      - name: Upload Desktop Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_BETA == 'true' }}
          make_latest: ${{ env.IS_BETA != 'true' }}
          name: ${{ env.IS_BETA == 'true'
            && format('Portix {0} (Beta)', github.ref_name)
            || format('Portix {0}', github.ref_name) }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
          fail_on_unmatched_files: false

  release-libs:
    name: "Release Native Libraries"
    runs-on: ubuntu-latest
    needs:
      - build-rust-macos
      - build-rust-linux
      - build-rust-windows

    if: always() && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download available libraries
        uses: actions/download-artifact@v7
        with:
          pattern: "*-lib"
          path: libs/
          merge-multiple: true
        continue-on-error: true

      - name: List available libraries
        shell: bash
        run: |
          echo "Available native libraries:"
          if [ -d libs ]; then
            find libs -type f -print
          else
            echo "No libraries directory"
          fi

      - name: Check available libraries
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          if [ -d libs ]; then
            COUNT=$(find libs -type f | wc -l)
          fi
          echo "Library artifact count: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No native libraries were produced"
            exit 1
          fi

      - name: Upload Native Libraries
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_BETA == 'true' }}
          make_latest: ${{ env.IS_BETA != 'true' }}
          files: |
            libs/**/*.so
            libs/**/*.dll
            libs/**/*.dylib
          fail_on_unmatched_files: false

  snap:
    name: "Build Snap"
    runs-on: ubuntu-latest
    needs: [build-desktop-linux]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync snap version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          SNAPCRAFT_FILE="snap/snapcraft.yaml"

          test -f "$SNAPCRAFT_FILE"

          if grep -qE '^version:' "$SNAPCRAFT_FILE"; then
            sed -i "s/^version:.*/version: \"${VERSION}\"/" "$SNAPCRAFT_FILE"
          else
            sed -i "/^name:/a version: \"${VERSION}\"" "$SNAPCRAFT_FILE"
          fi

          grep '^version:' "$SNAPCRAFT_FILE"

      - name: Build Snap
        id: snap
        uses: snapcore/action-build@v1

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: portix-snap-${{ github.ref_name }}
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

      - name: Publish Snap
        if: env.IS_BETA != 'true'
        continue-on-error: true
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN }}

      - name: Upload Snap to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_BETA == 'true' }}
          files: ${{ steps.snap.outputs.snap }}

  flatpak:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    needs: [build-desktop-linux]
    if: startsWith(github.ref, 'refs/tags/')

    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux bundle
        uses: actions/download-artifact@v7
        with:
          name: portix-Linux-${{ needs.build-desktop-linux.outputs.release_name }}
          path: artifact/

      - name: List Linux artifacts
        shell: bash
        run: find artifact -type f -print

      - name: Extract Linux bundle
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="artifact/portix-linux-${{ needs.build-desktop-linux.outputs.release_name }}.tar.gz"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Linux archive not found: $ARCHIVE"
            exit 1
          fi

          mkdir -p flatpak/bundle-src

          tar \
            -xzf "$ARCHIVE" \
            -C flatpak/bundle-src \
            --strip-components=1

      - name: Copy Flatpak assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flatpak/assets

          cp assets/icons/portix_launcher.png flatpak/assets/
          cp flatpak/com.github.asepimam.Portix.desktop flatpak/assets/
          cp flatpak/com.github.asepimam.Portix.metainfo.xml flatpak/assets/

      - name: Validate Flatpak icon
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import struct

          icon = "flatpak/assets/portix_launcher.png"

          with open(icon, "rb") as f:
              data = f.read(24)

          if len(data) < 24:
              raise ValueError("PNG file is invalid or too small")

          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise ValueError("File is not a valid PNG")

          width, height = struct.unpack(">II", data[16:24])

          if width != height:
              raise ValueError(f"Icon is {width}x{height}, must be square")

          print(f"Flatpak icon is valid: {width}x{height}")
          PY

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: portix-${{ github.ref_name }}.flatpak
          manifest-path: flatpak/com.github.asepimam.Portix.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: portix-flatpak-${{ github.ref_name }}
          path: portix-${{ github.ref_name }}.flatpak
          if-no-files-found: error

      - name: Upload Flatpak to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_BETA == 'true' }}
          files: portix-${{ github.ref_name }}.flatpak

  publish-flathub:
    name: "Publish to Flathub"
    runs-on: ubuntu-latest
    needs: [flatpak]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-beta')

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v6
        with:
          path: portix

      - name: Checkout Flathub repository
        uses: actions/checkout@v6
        with:
          repository: flathub/com.github.asepimam.Portix
          token: ${{ secrets.FLATHUB_PAT }}
          path: flathub-repo

      - name: Resolve application version
        id: vars
        shell: bash
        working-directory: portix
        run: |
          set -euo pipefail

          VERSION=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' portix_app/pubspec.yaml | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine version from pubspec.yaml"
            exit 1
          fi

          ARCHIVE="portix-linux-${{ github.ref_name }}-${VERSION}.tar.gz"
          URL="https://github.com/Asepimam/portix/releases/download/${{ github.ref_name }}/${ARCHIVE}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Archive: $ARCHIVE"
          echo "URL: $URL"

      - name: Download Linux bundle artifact
        uses: actions/download-artifact@v7
        with:
          name: portix-Linux-${{ github.ref_name }}-${{ steps.vars.outputs.version }}
          path: artifact/

      - name: Compute release hash
        id: hash
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="artifact/${{ steps.vars.outputs.archive }}"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Linux archive not found: $ARCHIVE"
            exit 1
          fi

          SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"

      - name: Update Flathub manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="flathub-repo/com.github.asepimam.Portix.yml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Flathub manifest not found"
            exit 1
          fi

          python3 - \
            "$MANIFEST" \
            "${{ steps.vars.outputs.url }}" \
            "${{ steps.hash.outputs.sha256 }}" <<'PY'
          import re
          import sys

          manifest_path = sys.argv[1]
          url = sys.argv[2]
          sha256 = sys.argv[3]

          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r"url:\s*.*portix-linux.*\.tar\.gz",
              f"url: {url}",
              content,
              count=1,
          )

          content = re.sub(
              r"(sha256:\s*)[a-fA-F0-9]{64}",
              rf"\g<1>{sha256}",
              content,
              count=1,
          )

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Flathub manifest updated")
          PY

      - name: Commit and push Flathub update
        shell: bash
        run: |
          set -euo pipefail

          cd flathub-repo

          git config user.name "portix-release-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add com.github.asepimam.Portix.yml
          git commit -m "Update to ${{ github.ref_name }}"
          git push origin HEAD
