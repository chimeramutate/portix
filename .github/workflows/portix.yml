name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta*"
      - "develop-*"
      - "release-*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version to build. Example: v1.0.0, v1.0.0-beta.1, develop-123"
        required: true
        type: string

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  SERV_DIR: portix_serv
  RDP_DIR: portix_rdp
  APP_DIR: portix_app
  ASSETS_DIR: portix_app/assets
  FRB_VERSION: "2.11.1"

jobs:
  release-info:
    name: "Determine Release Channel"
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      channel: ${{ steps.info.outputs.channel }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      make_latest: ${{ steps.info.outputs.make_latest }}

    steps:
      - name: Determine tag and channel
        id: info
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "Tag: $TAG"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
            VERSION="${TAG#v}"
            PRERELEASE="false"
            MAKE_LATEST="true"

          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta.*$ ]]; then
            CHANNEL="beta"
            VERSION="${TAG#v}"
            PRERELEASE="true"
            MAKE_LATEST="false"

          elif [[ "$TAG" =~ ^develop-(.+)$ ]]; then
            CHANNEL="development"
            DEV_ID="${BASH_REMATCH[1]}"
            DEV_ID=$(echo "$DEV_ID" | sed 's/[^0-9A-Za-z.+~-]/-/g')
            VERSION="0.0.0~dev.${DEV_ID}"
            PRERELEASE="true"
            MAKE_LATEST="false"

          elif [[ "$TAG" =~ ^release-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            CHANNEL="stable"
            VERSION="${BASH_REMATCH[1]}"
            PRERELEASE="false"
            MAKE_LATEST="true"

          else
            echo "::error::Unsupported tag format: $TAG"
            echo "Supported formats:"
            echo "  v1.0.0"
            echo "  v1.0.0-beta.1"
            echo "  develop-123"
            echo "  release-1.0.0"
            exit 1
          fi

          echo "========================================"
          echo "Tag:        $TAG"
          echo "Channel:    $CHANNEL"
          echo "Version:    $VERSION"
          echo "Prerelease: $PRERELEASE"
          echo "Latest:     $MAKE_LATEST"
          echo "========================================"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"

  build-serv:
    name: "Library portix_serv [${{ matrix.platform }}]"
    runs-on: ${{ matrix.os }}

    needs:
      - release-info

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            lib_name: libportix_serv.dylib
            artifact_name: macos-portix-serv

          - platform: Linux
            os: ubuntu-latest
            lib_name: libportix_serv.so
            artifact_name: linux-portix-serv

          - platform: Windows
            os: windows-latest
            lib_name: portix_serv.dll
            artifact_name: windows-portix-serv

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libgcrypt20-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: portix_serv
          key: portix-serv-${{ matrix.platform }}

      - name: Install Flutter Rust Bridge Codegen
        shell: bash
        run: |
          set -euo pipefail

          cargo install flutter_rust_bridge_codegen \
            --version "${{ env.FRB_VERSION }}" \
            --locked

      # ----------------------------------------------------------------------
      # FIX:
      # Use the existing portix_serv FRB configuration explicitly.
      # This prevents:
      # "Please provide rust_input"
      # ----------------------------------------------------------------------
      - name: Verify FRB config (portix_serv)
        working-directory: portix_serv
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="flutter_rust_bridge.yaml"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::FRB config not found: portix_serv/$CONFIG"
            exit 1
          fi

          echo "Using FRB config:"
          cat "$CONFIG"

      - name: Generate Flutter Rust Bridge (portix_serv)
        working-directory: portix_serv
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating FRB bindings for portix_serv..."

          flutter_rust_bridge_codegen generate \
            --config-file flutter_rust_bridge.yaml

          if [ ! -f "src/frb_generated.rs" ]; then
            echo "::error::FRB code generation failed - frb_generated.rs not created"
            exit 1
          fi

          echo "FRB generation complete"

      - name: Build portix_serv
        working-directory: portix_serv
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --profile release-hardened

      - name: Prepare library
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          FILE=$(find \
            portix_serv/target \
            -type f \
            -name "${{ matrix.lib_name }}" \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "::error::Could not find ${{ matrix.lib_name }}"
            exit 1
          fi

          echo "Found: $FILE"

          if [ "${{ matrix.platform }}" = "macOS" ]; then
            strip -x "$FILE" || true
          fi

          if [ "${{ matrix.platform }}" = "Linux" ]; then
            strip --strip-all "$FILE" || true
          fi

          cp "$FILE" "dist/${{ matrix.lib_name }}"

          ls -lah dist/

      - name: Upload portix_serv
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.lib_name }}
          if-no-files-found: error

  build-rdp:
    name: "Library portix_rdp [${{ matrix.platform }}]"
    runs-on: ${{ matrix.os }}

    needs:
      - release-info

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            lib_name: libportix_rdp.dylib
            artifact_name: macos-portix-rdp

          - platform: Linux
            os: ubuntu-latest
            lib_name: libportix_rdp.so
            artifact_name: linux-portix-rdp

          - platform: Windows
            os: windows-latest
            lib_name: portix_rdp.dll
            artifact_name: windows-portix-rdp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libgcrypt20-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: portix_rdp
          key: portix-rdp-${{ matrix.platform }}

      - name: Install Flutter Rust Bridge Codegen
        shell: bash
        run: |
          set -euo pipefail

          cargo install flutter_rust_bridge_codegen \
            --version "${{ env.FRB_VERSION }}" \
            --locked

      # ----------------------------------------------------------------------
      # FIX:
      # Use the existing dedicated RDP FRB configuration explicitly.
      # ----------------------------------------------------------------------
      - name: Verify FRB config (portix_rdp)
        working-directory: portix_rdp
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="flutter_rust_bridge_rdp.yaml"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::FRB config not found: portix_rdp/$CONFIG"
            exit 1
          fi

          echo "Using FRB config:"
          cat "$CONFIG"

      - name: Generate Flutter Rust Bridge (portix_rdp)
        working-directory: portix_rdp
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating FRB bindings for portix_rdp..."

          flutter_rust_bridge_codegen generate \
            --config-file flutter_rust_bridge_rdp.yaml

          if [ ! -f "src/frb_generated.rs" ]; then
            echo "::error::FRB code generation failed - frb_generated.rs not created"
            exit 1
          fi

          echo "FRB generation complete"

      - name: Build portix_rdp
        working-directory: portix_rdp
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --profile release-hardened

      - name: Prepare library
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          FILE=$(find \
            portix_rdp/target \
            -type f \
            -name "${{ matrix.lib_name }}" \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "::error::Could not find ${{ matrix.lib_name }}"
            exit 1
          fi

          echo "Found: $FILE"

          if [ "${{ matrix.platform }}" = "macOS" ]; then
            strip -x "$FILE" || true
          fi

          if [ "${{ matrix.platform }}" = "Linux" ]; then
            strip --strip-all "$FILE" || true
          fi

          cp "$FILE" "dist/${{ matrix.lib_name }}"

          ls -lah dist/

      - name: Upload portix_rdp
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.lib_name }}
          if-no-files-found: error

  build-desktop:
    name: "Desktop [${{ matrix.platform }}]"
    runs-on: ${{ matrix.os }}

    needs:
      - release-info
      - build-serv
      - build-rdp

    if: >
      always() &&
      needs.release-info.result == 'success' &&
      (needs.build-serv.result == 'success' || needs.build-serv.result == 'failure') &&
      (needs.build-rdp.result == 'success' || needs.build-rdp.result == 'failure')

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            flutter_target: macos
            serv_artifact: macos-portix-serv
            rdp_artifact: macos-portix-rdp
            serv_lib: libportix_serv.dylib
            rdp_lib: libportix_rdp.dylib

          - platform: Linux
            os: ubuntu-latest
            flutter_target: linux
            serv_artifact: linux-portix-serv
            rdp_artifact: linux-portix-rdp
            serv_lib: libportix_serv.so
            rdp_lib: libportix_rdp.so

          - platform: Windows
            os: windows-latest
            flutter_target: windows
            serv_artifact: windows-portix-serv
            rdp_artifact: windows-portix-rdp
            serv_lib: portix_serv.dll
            rdp_lib: portix_rdp.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download portix_serv
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.serv_artifact }}
          path: rust_libs/serv

      - name: Download portix_rdp
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.rdp_artifact }}
          path: rust_libs/rdp

      - name: Verify Rust libraries
        shell: bash
        run: |
          set -euo pipefail

          SERV="rust_libs/serv/${{ matrix.serv_lib }}"
          RDP="rust_libs/rdp/${{ matrix.rdp_lib }}"

          if [ ! -f "$SERV" ]; then
            echo "::error::Missing $SERV"
            exit 1
          fi

          if [ ! -f "$RDP" ]; then
            echo "::error::Missing $RDP"
            exit 1
          fi

          echo "portix_serv:"
          ls -lah "$SERV"

          echo
          echo "portix_rdp:"
          ls -lah "$RDP"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Linux dependencies
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libgcrypt20-dev

      - name: Flutter pub get
        working-directory: portix_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Verify Flutter Rust Bridge
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          dart_file = Path("portix_app/lib/src/rust/frb_generated.dart")
          rust_file = Path("portix_serv/src/frb_generated.rs")

          if not dart_file.exists():
              print(f"ERROR: Dart generated file not found: {dart_file}")
              sys.exit(1)

          if not rust_file.exists():
              print(f"ERROR: Rust generated file not found: {rust_file}")
              sys.exit(1)

          dart_text = dart_file.read_text(encoding="utf-8")
          rust_text = rust_file.read_text(encoding="utf-8")

          dart_patterns = [
              r"rustContentHash\s*=>\s*(-?\d+)",
              r"rustContentHash\s*=\s*(-?\d+)",
          ]

          rust_patterns = [
              r"FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH\s*:\s*i32\s*=\s*(-?\d+)",
              r"FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH\s*=\s*(-?\d+)",
          ]

          dart_hash = None
          for pattern in dart_patterns:
              match = re.search(pattern, dart_text)
              if match:
                  dart_hash = match.group(1)
                  break

          rust_hash = None
          for pattern in rust_patterns:
              match = re.search(pattern, rust_text)
              if match:
                  rust_hash = match.group(1)
                  break

          print(f"Dart generated file: {dart_file}")
          print(f"Rust generated file: {rust_file}")
          print(f"Dart content hash: {dart_hash or ''}")
          print(f"Rust content hash: {rust_hash or ''}")

          if dart_hash is None:
              print("ERROR: Could not find Dart Rust Bridge content hash")
              sys.exit(1)

          if rust_hash is None:
              print("ERROR: Could not find Rust Rust Bridge content hash")
              sys.exit(1)

          if dart_hash != rust_hash:
              print("ERROR: Dart/Rust Bridge content hash mismatch")
              print(f"Dart: {dart_hash}")
              print(f"Rust: {rust_hash}")
              sys.exit(1)

          print("Bridge hashes match")
          PY

      - name: Build Flutter macOS
        if: matrix.platform == 'macOS'
        working-directory: portix_app
        shell: bash
        run: |
          set -euo pipefail

          flutter build macos \
            --release \
            --dart-define=PORTIX_BACKEND=rust \
            --dart-define=RUST_LIBRARY_MODE=production

      - name: Build Flutter Linux
        if: matrix.platform == 'Linux'
        working-directory: portix_app
        shell: bash
        run: |
          set -euo pipefail

          flutter build linux \
            --release \
            --dart-define=PORTIX_BACKEND=rust \
            --dart-define=RUST_LIBRARY_MODE=production

      - name: Build Flutter Windows
        if: matrix.platform == 'Windows'
        working-directory: portix_app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter build windows `
            --release `
            --dart-define=PORTIX_BACKEND=rust `
            --dart-define=RUST_LIBRARY_MODE=production

      - name: Bundle Rust libraries macOS
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find \
            portix_app/build/macos/Build/Products/Release \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::macOS .app not found"
            exit 1
          fi

          cp "rust_libs/serv/${{ matrix.serv_lib }}" "$APP_PATH/Contents/MacOS/"
          cp "rust_libs/rdp/${{ matrix.rdp_lib }}" "$APP_PATH/Contents/MacOS/"

          codesign --force --sign - "$APP_PATH/Contents/MacOS/${{ matrix.serv_lib }}"
          codesign --force --sign - "$APP_PATH/Contents/MacOS/${{ matrix.rdp_lib }}"
          codesign --force --deep --sign - "$APP_PATH"

      - name: Bundle Rust libraries Linux
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="portix_app/build/linux/x64/release/bundle"

          if [ ! -d "$BUNDLE" ]; then
            echo "::error::Linux bundle not found: $BUNDLE"
            exit 1
          fi

          cp "rust_libs/serv/${{ matrix.serv_lib }}" "$BUNDLE/"
          cp "rust_libs/rdp/${{ matrix.rdp_lib }}" "$BUNDLE/"

          chmod +x \
            "$BUNDLE/${{ matrix.serv_lib }}" \
            "$BUNDLE/${{ matrix.rdp_lib }}"

          mkdir -p "$BUNDLE/lib"

          for lib in \
            libsecret-1.so.0 \
            libgcrypt.so.20
          do
            LIB_PATH=$(
              ldconfig -p 2>/dev/null \
              | grep "$lib" \
              | head -n 1 \
              | awk '{print $NF}'
            )

            if [ -n "$LIB_PATH" ] && [ -f "$LIB_PATH" ]; then
              if [ ! -f "$BUNDLE/lib/$lib" ]; then
                cp "$LIB_PATH" "$BUNDLE/lib/$lib"
              fi
            fi
          done

      - name: Bundle Rust libraries Windows
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseDir = "portix_app/build/windows/x64/runner/Release"

          if (-not (Test-Path $releaseDir)) {
            Write-Error "Windows release directory not found: $releaseDir"
            exit 1
          }

          Copy-Item "rust_libs/serv/${{ matrix.serv_lib }}" $releaseDir -Force
          Copy-Item "rust_libs/rdp/${{ matrix.rdp_lib }}" $releaseDir -Force

          Write-Host "Rust libraries bundled"

      - name: Package macOS
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find \
            portix_app/build/macos/Build/Products/Release \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "portix-macos-${{ needs.release-info.outputs.tag }}.zip"

      - name: Package Linux TAR
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          tar \
            -czf \
            "portix-linux-${{ needs.release-info.outputs.tag }}.tar.gz" \
            -C portix_app/build/linux/x64/release \
            bundle

      - name: Package Linux DEB
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.release-info.outputs.version }}"

          echo "Building .deb package version $VERSION"

          if ! [[ "$VERSION" =~ ^[0-9]+([0-9A-Za-z.+~:-]*)$ ]]; then
            echo "::error::Invalid Debian version: $VERSION"
            exit 1
          fi

          if [ ! -f "packaging/linux/build-deb.sh" ]; then
            echo "::error::packaging/linux/build-deb.sh not found"
            exit 1
          fi

          chmod +x packaging/linux/build-deb.sh
          bash packaging/linux/build-deb.sh "$VERSION"

      - name: Package Windows
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "portix_app/build/windows/x64/runner/Release/*"
          $destination = "portix-windows-${{ needs.release-info.outputs.tag }}.zip"

          Compress-Archive `
            -Path $source `
            -DestinationPath $destination `
            -Force

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ needs.release-info.outputs.tag }}
          path: |
            portix-*.zip
            portix-*.tar.gz
            *.deb
          if-no-files-found: warn

  release-desktop:
    name: "Release Desktop"
    runs-on: ubuntu-latest

    needs:
      - release-info
      - build-desktop

    if: always() &&
      needs.release-info.result == 'success'

    steps:
      - name: Download successful desktop artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          pattern: desktop-*-${{ needs.release-info.outputs.tag }}
          merge-multiple: false

      - name: List desktop artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Desktop artifacts:"
          find artifacts -type f -print || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-info.outputs.tag }}
          name: >-
            ${{ needs.release-info.outputs.channel == 'beta'
            && format('Portix {0} (Beta)', needs.release-info.outputs.tag)
            || needs.release-info.outputs.channel == 'development'
            && format('Portix {0} (Development)', needs.release-info.outputs.tag)
            || format('Portix {0}', needs.release-info.outputs.tag) }}
          prerelease: ${{ needs.release-info.outputs.prerelease }}
          make_latest: ${{ needs.release-info.outputs.make_latest }}
          files: |
            artifacts/**/*
          fail_on_unmatched_files: false

  release-libs:
    name: "Release Native Libraries"
    runs-on: ubuntu-latest

    needs:
      - release-info
      - build-serv
      - build-rdp

    if: always() &&
      needs.release-info.result == 'success'

    steps:
      - name: Download successful portix_serv libraries
        uses: actions/download-artifact@v7
        with:
          path: libs/serv/
          pattern: "*-portix-serv"
          merge-multiple: true

      - name: Download successful portix_rdp libraries
        uses: actions/download-artifact@v7
        with:
          path: libs/rdp/
          pattern: "*-portix-rdp"
          merge-multiple: true

      - name: List libraries
        shell: bash
        run: |
          set -euo pipefail

          find libs -type f -print || true

      - name: Upload native libraries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-info.outputs.tag }}
          prerelease: ${{ needs.release-info.outputs.prerelease }}
          make_latest: ${{ needs.release-info.outputs.make_latest }}
          files: |
            libs/**/*.so
            libs/**/*.dll
            libs/**/*.dylib
          fail_on_unmatched_files: false

  snap:
    name: "Build Snap"
    runs-on: ubuntu-latest

    needs:
      - release-info
      - build-desktop

    if: >
      always() &&
      needs.release-info.result == 'success' &&
      needs.release-info.outputs.channel != 'development' &&
      needs.build-desktop.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Snap assets
        shell: bash
        run: |
          set -euo pipefail

          ICON="portix_app/assets/icons/portix_launcher.png"

          if [ ! -f "$ICON" ]; then
            echo "::error::Snap icon not found:"
            echo "$ICON"
            exit 1
          fi

          mkdir -p assets/icons

          cp "$ICON" assets/icons/portix_launcher.png

          echo "Snap asset prepared:"
          ls -lah assets/icons/portix_launcher.png

      - name: Sync Snap version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.release-info.outputs.version }}"

          VERSION=$(echo "$VERSION" | sed 's/~/./g')
          VERSION=$(echo "$VERSION" | sed 's/[^0-9A-Za-z.+-]/-/g')

          SNAPCRAFT_FILE="snap/snapcraft.yaml"

          if [ ! -f "$SNAPCRAFT_FILE" ]; then
            echo "::error::snap/snapcraft.yaml not found"
            exit 1
          fi

          if grep -qE '^version:' "$SNAPCRAFT_FILE"; then
            sed -i "s/^version:.*/version: \"${VERSION}\"/" "$SNAPCRAFT_FILE"
          else
            sed -i "/^name:/a version: \"${VERSION}\"" "$SNAPCRAFT_FILE"
          fi

          grep '^version:' "$SNAPCRAFT_FILE"

      - name: Build Snap
        id: snap
        uses: snapcore/action-build@v1

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: snap-${{ needs.release-info.outputs.tag }}
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

      - name: Publish Snap stable
        if: needs.release-info.outputs.channel == 'stable'
        continue-on-error: true
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN }}

      - name: Upload Snap to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-info.outputs.tag }}
          prerelease: ${{ needs.release-info.outputs.prerelease }}
          make_latest: ${{ needs.release-info.outputs.make_latest }}
          files: ${{ steps.snap.outputs.snap }}

  flatpak:
    name: "Build Flatpak"
    runs-on: ubuntu-latest

    needs:
      - release-info
      - build-desktop

    if: >
      always() &&
      needs.release-info.result == 'success' &&
      needs.release-info.outputs.channel != 'development' &&
      needs.build-desktop.result == 'success'

    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux desktop artifact
        uses: actions/download-artifact@v7
        with:
          name: desktop-Linux-${{ needs.release-info.outputs.tag }}
          path: artifact/

      - name: List Linux artifact
        shell: bash
        run: |
          set -euo pipefail

          find artifact -type f -print

      - name: Extract Linux bundle
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="artifact/portix-linux-${{ needs.release-info.outputs.tag }}.tar.gz"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Linux archive not found:"
            echo "$ARCHIVE"
            exit 1
          fi

          mkdir -p flatpak/bundle-src

          tar \
            -xzf "$ARCHIVE" \
            -C flatpak/bundle-src \
            --strip-components=1

      - name: Prepare Flatpak assets
        shell: bash
        run: |
          set -euo pipefail

          ICON="portix_app/assets/icons/portix_launcher.png"
          DESKTOP="portix_app/assets/portix.desktop"
          METAINFO="portix_app/assets/portix.metainfo.xml"

          mkdir -p flatpak/assets

          if [ ! -f "$ICON" ]; then
            echo "::error::Icon not found:"
            echo "$ICON"
            exit 1
          fi

          cp "$ICON" flatpak/assets/portix_launcher.png

          if [ -f "flatpak/com.github.asepimam.Portix.desktop" ]; then
            cp flatpak/com.github.asepimam.Portix.desktop flatpak/assets/
          elif [ -f "$DESKTOP" ]; then
            cp "$DESKTOP" flatpak/assets/
          else
            echo "WARNING: Desktop file not found in known locations"
          fi

          if [ -f "flatpak/com.github.asepimam.Portix.metainfo.xml" ]; then
            cp flatpak/com.github.asepimam.Portix.metainfo.xml flatpak/assets/
          elif [ -f "$METAINFO" ]; then
            cp "$METAINFO" flatpak/assets/
          else
            echo "WARNING: Metainfo file not found in known locations"
          fi

          find flatpak/assets -type f -print

      - name: Validate Flatpak icon
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import struct
          import sys

          icon = "flatpak/assets/portix_launcher.png"

          with open(icon, "rb") as f:
              data = f.read(24)

          if len(data) < 24:
              print("ERROR: PNG is too small")
              sys.exit(1)

          if data[:8] != b"\x89PNG\r\n\x1a\n":
              print("ERROR: Not a valid PNG")
              sys.exit(1)

          width, height = struct.unpack(">II", data[16:24])

          print(f"Icon size: {width}x{height}")

          if width != height:
              print("ERROR: Icon must be square")
              sys.exit(1)

          print("Flatpak icon is valid")
          PY

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: portix-${{ needs.release-info.outputs.tag }}.flatpak
          manifest-path: flatpak/com.github.asepimam.Portix.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ needs.release-info.outputs.tag }}
          path: portix-${{ needs.release-info.outputs.tag }}.flatpak
          if-no-files-found: error

      - name: Upload Flatpak to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-info.outputs.tag }}
          prerelease: ${{ needs.release-info.outputs.prerelease }}
          make_latest: ${{ needs.release-info.outputs.make_latest }}
          files: portix-${{ needs.release-info.outputs.tag }}.flatpak

  publish-flathub:
    name: "Publish Flathub"
    runs-on: ubuntu-latest

    needs:
      - release-info
      - build-desktop
      - flatpak

    if: >
      always() &&
      needs.release-info.result == 'success' &&
      needs.release-info.outputs.channel == 'stable' &&
      needs.build-desktop.result == 'success' &&
      needs.flatpak.result == 'success'

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: portix

      - name: Checkout Flathub repository
        uses: actions/checkout@v6
        with:
          repository: flathub/com.github.asepimam.Portix
          token: ${{ secrets.FLATHUB_PAT }}
          path: flathub-repo

      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: desktop-Linux-${{ needs.release-info.outputs.tag }}
          path: artifact/

      - name: Compute release hash
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.release-info.outputs.tag }}"
          ARCHIVE="artifact/portix-linux-${TAG}.tar.gz"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Linux archive not found:"
            echo "$ARCHIVE"
            exit 1
          fi

          SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')

          URL="https://github.com/Asepimam/portix/releases/download/${TAG}/portix-linux-${TAG}.tar.gz"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          echo "SHA256: $SHA256"
          echo "URL:    $URL"

      - name: Update Flathub manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="flathub-repo/com.github.asepimam.Portix.yml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Manifest not found:"
            echo "$MANIFEST"
            exit 1
          fi

          python3 - \
            "$MANIFEST" \
            "${{ steps.vars.outputs.url }}" \
            "${{ steps.vars.outputs.sha256 }}" <<'PY'
          import re
          import sys

          manifest_path = sys.argv[1]
          url = sys.argv[2]
          sha256 = sys.argv[3]

          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r"url:\s*.*portix-linux.*\.tar\.gz",
              f"url: {url}",
              content
          )

          content = re.sub(
              r"(sha256:\s*)[a-fA-F0-9]{64}",
              rf"\g<1>{sha256}",
              content
          )

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Flathub manifest updated")
          PY

      - name: Commit Flathub update
        shell: bash
        run: |
          set -euo pipefail

          cd flathub-repo

          git config user.name "portix-release-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet; then
            echo "No Flathub changes"
            exit 0
          fi

          git add com.github.asepimam.Portix.yml
          git commit -m "Update to ${{ needs.release-info.outputs.tag }}"
          git push origin HEAD
