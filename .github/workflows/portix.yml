name: Build Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  SERV_DIR: portix_serv
  RDP_DIR: portix_rdp
  APP_DIR: portix_app
  ASSETS_DIR: portix_app/assets
  FRB_VERSION: 2.11.1
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CACHE_ON_FAILURE: false

jobs:
  # ===========================================================================
  # WINDOWS
  # ===========================================================================
  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Flutter
      # -----------------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          dart --version

      # -----------------------------------------------------------------------
      # Rust
      # -----------------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Verify Rust
        shell: bash
        run: |
          set -euo pipefail

          rustc --version
          cargo --version
          rustup show

      # -----------------------------------------------------------------------
      # Flutter desktop
      # -----------------------------------------------------------------------
      - name: Enable Windows desktop
        shell: bash
        run: |
          set -euo pipefail

          flutter config --enable-windows-desktop
          flutter doctor -v

      # -----------------------------------------------------------------------
      # Install FRB codegen
      #
      # IMPORTANT:
      # flutter_rust_bridge_codegen requires Flutter/Dart to be available.
      # Therefore this happens AFTER Flutter setup.
      # -----------------------------------------------------------------------
      - name: Install flutter_rust_bridge_codegen
        shell: bash
        run: |
          set -euo pipefail

          cargo install \
            flutter_rust_bridge_codegen \
            --version "${FRB_VERSION}" \
            --locked

          flutter_rust_bridge_codegen --version

      # -----------------------------------------------------------------------
      # Verify repository structure
      # -----------------------------------------------------------------------
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Top-level:"
          ls -la

          echo
          echo "portix_app:"
          ls -la "${APP_DIR}"

          echo
          echo "portix_rdp:"
          ls -la "${RDP_DIR}"

          echo
          echo "portix_serv:"
          ls -la "${SERV_DIR}"

          echo
          echo "FRB config:"
          if [ ! -f "${APP_DIR}/flutter_rust_bridge.yaml" ]; then
            echo "::error::Missing ${APP_DIR}/flutter_rust_bridge.yaml"
            exit 1
          fi

          cat "${APP_DIR}/flutter_rust_bridge.yaml"

      # -----------------------------------------------------------------------
      # Flutter dependencies
      # -----------------------------------------------------------------------
      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

      # -----------------------------------------------------------------------
      # Generate Flutter Rust Bridge
      #
      # IMPORTANT:
      # The config exists ONLY in portix_app.
      #
      # DO NOT run:
      #   cd portix_rdp
      #   flutter_rust_bridge_codegen ...
      #
      # DO NOT run:
      #   cd portix_serv
      #   flutter_rust_bridge_codegen ...
      #
      # Run from portix_app using the config located there.
      # -----------------------------------------------------------------------
      - name: Generate Flutter Rust Bridge
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="flutter_rust_bridge.yaml"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::FRB config not found: ${APP_DIR}/$CONFIG"
            exit 1
          fi

          echo "Using FRB config:"
          cat "$CONFIG"

          echo
          echo "Generating Flutter Rust Bridge..."

          flutter_rust_bridge_codegen generate \
            --config-file "$CONFIG"

      # -----------------------------------------------------------------------
      # Verify generated bindings
      # -----------------------------------------------------------------------
      - name: Verify generated bindings
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated files under ${APP_DIR}/lib/src:"

          if [ -d "${APP_DIR}/lib/src" ]; then
            find "${APP_DIR}/lib/src" -maxdepth 4 -type f | sort
          fi

          if [ ! -d "${APP_DIR}/lib/src/rust" ]; then
            echo "::warning::${APP_DIR}/lib/src/rust was not generated."
          fi

          if [ ! -d "${APP_DIR}/lib/src/rust_rdp" ]; then
            echo "::warning::${APP_DIR}/lib/src/rust_rdp was not generated."
          fi

      # -----------------------------------------------------------------------
      # Build RDP backend
      # -----------------------------------------------------------------------
      - name: Build RDP backend
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --release \
            --manifest-path "${RDP_DIR}/Cargo.toml" \
            --target x86_64-pc-windows-msvc

      # -----------------------------------------------------------------------
      # Build SSH/server backend
      # -----------------------------------------------------------------------
      - name: Build server backend
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --release \
            --manifest-path "${SERV_DIR}/Cargo.toml" \
            --target x86_64-pc-windows-msvc

      # -----------------------------------------------------------------------
      # Verify native libraries
      # -----------------------------------------------------------------------
      - name: Verify Windows native libraries
        shell: bash
        run: |
          set -euo pipefail

          echo "RDP release directory:"
          ls -la "${RDP_DIR}/target/x86_64-pc-windows-msvc/release" || true

          echo
          echo "Server release directory:"
          ls -la "${SERV_DIR}/target/x86_64-pc-windows-msvc/release" || true

          RDP_DLL="${RDP_DIR}/target/x86_64-pc-windows-msvc/release/portix_rdp.dll"
          SERV_DLL="${SERV_DIR}/target/x86_64-pc-windows-msvc/release/portix_serv.dll"

          if [ ! -f "$RDP_DLL" ]; then
            echo "::error::RDP DLL not found: $RDP_DLL"
            exit 1
          fi

          if [ ! -f "$SERV_DLL" ]; then
            echo "::error::Server DLL not found: $SERV_DLL"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Flutter clean
      # -----------------------------------------------------------------------
      - name: Flutter clean
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

      # -----------------------------------------------------------------------
      # Copy native DLLs into Flutter application
      #
      # They are copied into the Windows runner output after Flutter build.
      # -----------------------------------------------------------------------
      - name: Build Flutter Windows
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter build windows --release

      # -----------------------------------------------------------------------
      # Copy native backend libraries into Flutter bundle
      # -----------------------------------------------------------------------
      - name: Bundle Windows Rust libraries
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="${APP_DIR}/build/windows/x64/runner/Release"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "::error::Flutter Windows release directory not found: $RELEASE_DIR"
            exit 1
          fi

          cp \
            "${RDP_DIR}/target/x86_64-pc-windows-msvc/release/portix_rdp.dll" \
            "$RELEASE_DIR/"

          cp \
            "${SERV_DIR}/target/x86_64-pc-windows-msvc/release/portix_serv.dll" \
            "$RELEASE_DIR/"

          echo "Windows release bundle:"
          ls -la "$RELEASE_DIR"

      # -----------------------------------------------------------------------
      # Package
      # -----------------------------------------------------------------------
      - name: Package Windows
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"

          if (-not $version -or $version -eq "main") {
            $version = "dev"
          }

          $source = "${{ env.APP_DIR }}/build/windows/x64/runner/Release"
          $output = "portix-windows-x64-$version.zip"

          Compress-Archive `
            -Path "$source/*" `
            -DestinationPath "$output" `
            -Force

          Write-Host "Created $output"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: portix-windows-x64
          path: portix-windows-x64-*.zip
          if-no-files-found: error

  # ===========================================================================
  # MACOS
  # ===========================================================================
  build-macos:
    name: Build macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          set -euo pipefail

          flutter --version
          dart --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable macOS desktop
        run: |
          set -euo pipefail

          flutter config --enable-macos-desktop
          flutter doctor -v

      - name: Install FRB codegen
        run: |
          set -euo pipefail

          cargo install \
            flutter_rust_bridge_codegen \
            --version "${FRB_VERSION}" \
            --locked

          flutter_rust_bridge_codegen --version

      - name: Verify FRB config
        run: |
          set -euo pipefail

          CONFIG="${APP_DIR}/flutter_rust_bridge.yaml"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::FRB config not found: $CONFIG"
            exit 1
          fi

          echo "Using:"
          cat "$CONFIG"

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          flutter pub get

      - name: Generate Flutter Rust Bridge
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          flutter_rust_bridge_codegen generate \
            --config-file flutter_rust_bridge.yaml

      - name: Verify generated bindings
        run: |
          set -euo pipefail

          find "${APP_DIR}/lib/src" -maxdepth 4 -type f | sort || true

      - name: Build RDP backend
        run: |
          set -euo pipefail

          cargo build \
            --release \
            --manifest-path "${RDP_DIR}/Cargo.toml"

      - name: Build server backend
        run: |
          set -euo pipefail

          cargo build \
            --release \
            --manifest-path "${SERV_DIR}/Cargo.toml"

      - name: Verify macOS libraries
        run: |
          set -euo pipefail

          ls -la "${RDP_DIR}/target/release" || true
          ls -la "${SERV_DIR}/target/release" || true

      - name: Flutter clean
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

      - name: Build Flutter macOS
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          flutter build macos --release

      - name: Bundle macOS Rust libraries
        run: |
          set -euo pipefail

          APP_BUNDLE=$(find "${APP_DIR}/build/macos/Build/Products/Release" \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::macOS .app bundle not found"
            exit 1
          fi

          MACOS_DIR="$APP_BUNDLE/Contents/MacOS"

          cp \
            "${RDP_DIR}/target/release/libportix_rdp.dylib" \
            "$MACOS_DIR/" 2>/dev/null || true

          cp \
            "${SERV_DIR}/target/release/libportix_serv.dylib" \
            "$MACOS_DIR/" 2>/dev/null || true

          echo "macOS application:"
          ls -la "$MACOS_DIR"

      - name: Package macOS
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME:-dev}"

          APP_BUNDLE=$(find "${APP_DIR}/build/macos/Build/Products/Release" \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::macOS .app bundle not found"
            exit 1
          fi

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_BUNDLE" \
            "portix-macos-$VERSION.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: portix-macos
          path: portix-macos-*.zip
          if-no-files-found: error

  # ===========================================================================
  # LINUX
  # ===========================================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libssl-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          set -euo pipefail

          flutter --version
          dart --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Linux desktop
        run: |
          set -euo pipefail

          flutter config --enable-linux-desktop
          flutter doctor -v

      - name: Install FRB codegen
        run: |
          set -euo pipefail

          cargo install \
            flutter_rust_bridge_codegen \
            --version "${FRB_VERSION}" \
            --locked

          flutter_rust_bridge_codegen --version

      - name: Verify FRB config
        run: |
          set -euo pipefail

          CONFIG="${APP_DIR}/flutter_rust_bridge.yaml"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::FRB config not found: $CONFIG"
            exit 1
          fi

          echo "Using:"
          cat "$CONFIG"

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          flutter pub get

      - name: Generate Flutter Rust Bridge
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          flutter_rust_bridge_codegen generate \
            --config-file flutter_rust_bridge.yaml

      - name: Verify generated bindings
        run: |
          set -euo pipefail

          find "${APP_DIR}/lib/src" -maxdepth 4 -type f | sort || true

      - name: Build RDP backend
        run: |
          set -euo pipefail

          cargo build \
            --release \
            --manifest-path "${RDP_DIR}/Cargo.toml"

      - name: Build server backend
        run: |
          set -euo pipefail

          cargo build \
            --release \
            --manifest-path "${SERV_DIR}/Cargo.toml"

      - name: Verify Linux libraries
        run: |
          set -euo pipefail

          ls -la "${RDP_DIR}/target/release"
          ls -la "${SERV_DIR}/target/release"

          if [ ! -f "${RDP_DIR}/target/release/libportix_rdp.so" ]; then
            echo "::error::libportix_rdp.so not found"
            exit 1
          fi

          if [ ! -f "${SERV_DIR}/target/release/libportix_serv.so" ]; then
            echo "::error::libportix_serv.so not found"
            exit 1
          fi

      - name: Flutter clean
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get

      - name: Build Flutter Linux
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          flutter build linux --release

      - name: Bundle Linux Rust libraries
        run: |
          set -euo pipefail

          RELEASE_DIR="${APP_DIR}/build/linux/x64/release/bundle"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "::error::Linux Flutter bundle not found: $RELEASE_DIR"
            exit 1
          fi

          cp \
            "${RDP_DIR}/target/release/libportix_rdp.so" \
            "$RELEASE_DIR/"

          cp \
            "${SERV_DIR}/target/release/libportix_serv.so" \
            "$RELEASE_DIR/"

          echo "Linux bundle:"
          ls -la "$RELEASE_DIR"

      - name: Package Linux
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME:-dev}"

          tar \
            -C "${APP_DIR}/build/linux/x64/release" \
            -czf "portix-linux-x64-${VERSION}.tar.gz" \
            bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: portix-linux-x64
          path: portix-linux-x64-*.tar.gz
          if-no-files-found: error

  # ===========================================================================
  # RELEASE
  # ===========================================================================
  release:
    name: Publish Release
    needs:
      - build-windows
      - build-macos
      - build-linux

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: portix-windows-x64
          path: release/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: portix-macos
          path: release/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: portix-linux-x64
          path: release/linux

      - name: Show release files
        run: |
          set -euo pipefail

          echo "Release artifacts:"
          find release -type f -maxdepth 3 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Portix ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/windows/*
            release/macos/*
            release/linux/*
