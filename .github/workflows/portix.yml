name: Build & Release

on:
  push:
    branches:
      - main
      - develop
      - staging
      - "release/**"
    tags:
      - "v*.*.*"
      - "v*.*.*-beta*"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "beta"
        type: choice
        options:
          - stable
          - beta
          - development

permissions:
  contents: write
  pull-requests: read

env:
  IS_BETA: ${{ contains(github.ref_name, '-beta') || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'beta') || (github.event_name == 'push' && github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/')) }}

  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}

  IS_MAIN_BRANCH: ${{ github.ref_name == 'main' }}

  BRANCH_NAME: ${{ github.ref_name }}

  RUST_BACKTRACE: 1

# ============================================================================
# JOBS
# ============================================================================

jobs:
  # ==========================================================================
  # PHASE 0
  # PR VALIDATION
  #
  # Pull Request -> only Rust check/test.
  # Desktop build tidak dijalankan untuk PR agar CI lebih cepat.
  # ==========================================================================

  validate-rust:
    name: "✓ Validate Rust [PR]"

    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    concurrency:
      group: validate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: portix_serv
          key: pr-check

      - name: Check compilation
        working-directory: portix_serv
        run: cargo check --all-features

      - name: Run tests
        working-directory: portix_serv
        run: cargo test --lib --all-features

  # ==========================================================================
  # PHASE 1
  # BUILD RUST LIBRARY
  #
  # Target:
  # - Linux
  # - macOS
  # - Windows
  #
  # Tidak ada Android / iOS.
  # ==========================================================================

  build-rust:
    name: "Rust [${{ matrix.target }}] @ ${{ github.ref_name }}"

    runs-on: ${{ matrix.os }}

    if: github.event_name != 'pull_request'

    concurrency:
      group: build-rust-${{ github.ref_name }}-${{ matrix.target }}
      cancel-in-progress: true

    strategy:
      fail-fast: false

      matrix:
        include:
          # ------------------------------------------------------------------
          # macOS
          # ------------------------------------------------------------------

          - target: macos
            os: macos-latest
            rust_target: ""
            lib_name: libportix_serv.dylib
            output_name: libportix_serv_macos.dylib

          # ------------------------------------------------------------------
          # Linux
          # ------------------------------------------------------------------

          - target: linux
            os: ubuntu-latest
            rust_target: ""
            lib_name: libportix_serv.so
            output_name: libportix_serv_linux.so

          # ------------------------------------------------------------------
          # Windows
          # ------------------------------------------------------------------

          - target: windows
            os: windows-latest
            rust_target: ""
            lib_name: portix_serv.dll
            output_name: portix_serv_windows.dll

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6

      # ----------------------------------------------------------------------
      # Rust
      # ----------------------------------------------------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ----------------------------------------------------------------------
      # Cargo cache
      # ----------------------------------------------------------------------

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: portix_serv
          key: ${{ matrix.target }}

      # ----------------------------------------------------------------------
      # Linux dependencies
      #
      # Rust build + Flutter Linux membutuhkan dependency GTK.
      # ----------------------------------------------------------------------

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libglu1-mesa-dev

      # ----------------------------------------------------------------------
      # Build Rust
      #
      # shell bash digunakan supaya command ini konsisten di:
      # Linux / macOS / Windows.
      # ----------------------------------------------------------------------

      - name: Build Rust library
        working-directory: portix_serv
        shell: bash
        run: |
          set -euo pipefail

          cargo build --profile release-hardened

      # ----------------------------------------------------------------------
      # Strip macOS
      # ----------------------------------------------------------------------

      - name: Strip binary (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          find portix_serv/target \
            -type f \
            -name "${{ matrix.lib_name }}" \
            -path "*/release-hardened/*" \
            -exec strip -x {} \; \
            || true

      # ----------------------------------------------------------------------
      # Strip Linux
      # ----------------------------------------------------------------------

      - name: Strip binary (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          find portix_serv/target \
            -type f \
            -name "${{ matrix.lib_name }}" \
            -path "*/release-hardened/*" \
            -exec strip --strip-all {} \; \
            || true

      # ----------------------------------------------------------------------
      # Prepare artifact
      # ----------------------------------------------------------------------

      - name: Prepare Rust artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          LIB_PATH=$(find portix_serv/target \
            -type f \
            -name "${{ matrix.lib_name }}" \
            -path "*/release-hardened/*" \
            | head -n 1)

          if [ -z "$LIB_PATH" ]; then
            echo "::error::Could not find ${{ matrix.lib_name }}"
            exit 1
          fi

          echo "Found Rust library:"
          echo "$LIB_PATH"

          cp "$LIB_PATH" "dist/${{ matrix.lib_name }}"

          ls -lah dist/

      # ----------------------------------------------------------------------
      # Security scan
      # ----------------------------------------------------------------------

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: dist/
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      # ----------------------------------------------------------------------
      # Upload Rust artifact
      # ----------------------------------------------------------------------

      - name: Upload Rust library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-lib
          path: dist/${{ matrix.lib_name }}
          if-no-files-found: error

  # ==========================================================================
  # PHASE 2
  # BUILD FLUTTER DESKTOP
  #
  # Target:
  # - Linux
  # - macOS
  # - Windows
  #
  # Runs on branch push / tag / manual trigger.
  # PR tidak menjalankan desktop build.
  # ==========================================================================

  build-desktop:
    name: "Desktop [${{ matrix.platform }}] @ ${{ github.ref_name }}"

    runs-on: ${{ matrix.os }}

    needs:
      - build-rust

    if: github.event_name != 'pull_request'

    concurrency:
      group: build-desktop-${{ github.ref_name }}-${{ matrix.platform }}
      cancel-in-progress: true

    strategy:
      fail-fast: false

      matrix:
        include:
          # ------------------------------------------------------------------
          # macOS
          # ------------------------------------------------------------------

          - platform: macOS
            os: macos-latest
            flutter_target: macos
            rust_lib_artifact: macos-lib
            lib_name: libportix_serv.dylib

          # ------------------------------------------------------------------
          # Linux
          # ------------------------------------------------------------------

          - platform: Linux
            os: ubuntu-latest
            flutter_target: linux
            rust_lib_artifact: linux-lib
            lib_name: libportix_serv.so

          # ------------------------------------------------------------------
          # Windows
          # ------------------------------------------------------------------

          - platform: Windows
            os: windows-latest
            flutter_target: windows
            rust_lib_artifact: windows-lib
            lib_name: portix_serv.dll

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6

      # ----------------------------------------------------------------------
      # Linux dependencies
      #
      # Ini yang memperbaiki:
      #
      # CMake Error:
      # The following required packages were not found:
      # - gtk+-3.0
      # ----------------------------------------------------------------------

      - name: Install Linux Flutter dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libglu1-mesa-dev

      # ----------------------------------------------------------------------
      # Download Rust library
      # ----------------------------------------------------------------------

      - name: Download Rust library
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.rust_lib_artifact }}
          path: portix_serv_lib/

      # ----------------------------------------------------------------------
      # Verify downloaded library
      # ----------------------------------------------------------------------

      - name: Verify Rust library
        shell: bash
        run: |
          set -euo pipefail

          LIB="portix_serv_lib/${{ matrix.lib_name }}"

          if [ ! -f "$LIB" ]; then
            echo "::error::Rust library not found: $LIB"
            echo "Contents of portix_serv_lib:"
            find portix_serv_lib -maxdepth 2 -type f -print
            exit 1
          fi

          echo "✓ Rust library found:"
          ls -lah "$LIB"

      # ----------------------------------------------------------------------
      # Flutter
      # ----------------------------------------------------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ----------------------------------------------------------------------
      # Flutter dependencies
      # ----------------------------------------------------------------------

      - name: Get Flutter dependencies
        working-directory: portix_app
        run: flutter pub get

      # ----------------------------------------------------------------------
      # Dart / Rust Bridge hash check
      #
      # Versi lama gagal karena regex tidak menemukan hash.
      #
      # Sekarang:
      # - mencari format hash dengan regex yang lebih fleksibel
      # - jika hash tidak ditemukan -> WARNING, bukan langsung gagal
      # - jika dua hash ditemukan dan berbeda -> FAIL
      # ----------------------------------------------------------------------

      - name: Verify Dart-Rust Bridge codegen
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          dart_file = Path(
              "portix_app/lib/src/rust/frb_generated.dart"
          )

          rust_file = Path(
              "portix_serv/src/frb_generated.rs"
          )

          print(f"Dart generated file: {dart_file}")
          print(f"Rust generated file: {rust_file}")

          if not dart_file.exists():
              print("::warning::Dart generated file not found.")
              print("Skipping Dart/Rust bridge hash verification.")
              sys.exit(0)

          if not rust_file.exists():
              print("::warning::Rust generated file not found.")
              print("Skipping Dart/Rust bridge hash verification.")
              sys.exit(0)

          dart_content = dart_file.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          rust_content = rust_file.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          # Dart:
          # int get rustContentHash => 123456;
          dart_match = re.search(
              r"rustContentHash\s*=>\s*(-?\d+)",
              dart_content
          )

          # Rust:
          # const FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH: i32 = 123456;
          rust_match = re.search(
              r"FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH"
              r"\s*:\s*i32\s*=\s*(-?\d+)",
              rust_content
          )

          dart_hash = (
              dart_match.group(1)
              if dart_match
              else None
          )

          rust_hash = (
              rust_match.group(1)
              if rust_match
              else None
          )

          print(f"Dart content hash: {dart_hash or '<not found>'}")
          print(f"Rust content hash: {rust_hash or '<not found>'}")

          if dart_hash is None or rust_hash is None:
              print(
                  "::warning::"
                  "Could not find Dart/Rust Bridge content hash. "
                  "Skipping hash comparison."
              )
              sys.exit(0)

          if dart_hash != rust_hash:
              print(
                  "::error::"
                  f"Content hash mismatch! "
                  f"Dart ({dart_hash}) != Rust ({rust_hash})"
              )
              print(
                  "Run flutter_rust_bridge_codegen "
                  "to regenerate bridge files."
              )
              sys.exit(1)

          print("✓ Dart/Rust Bridge hashes match")
          PY

      # ----------------------------------------------------------------------
      # Build Flutter
      #
      # IMPORTANT:
      # Tidak menggunakan "\" di Windows.
      # Command dibuat satu baris agar PowerShell aman.
      # ----------------------------------------------------------------------

      - name: Build Flutter app
        working-directory: portix_app
        shell: bash
        run: |
          set -euo pipefail

          flutter build ${{ matrix.flutter_target }} --release \
            --dart-define=PORTIX_BACKEND=rust \
            --dart-define=RUST_LIBRARY_MODE=production

      # =========================================================================
      # BUNDLE RUST LIBRARY
      # =========================================================================

      # ----------------------------------------------------------------------
      # macOS
      # ----------------------------------------------------------------------

      - name: Bundle Rust library - macOS
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find \
            portix_app/build/macos/Build/Products/Release \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find macOS .app bundle"
            exit 1
          fi

          echo "App:"
          echo "$APP_PATH"

          cp \
            "portix_serv_lib/${{ matrix.lib_name }}" \
            "$APP_PATH/Contents/MacOS/"

          # Ad-hoc signing.
          codesign \
            --force \
            --sign - \
            "$APP_PATH/Contents/MacOS/${{ matrix.lib_name }}"

          codesign \
            --force \
            --deep \
            --sign - \
            "$APP_PATH"

          echo "✓ macOS Rust library bundled"

      # ----------------------------------------------------------------------
      # Linux
      # ----------------------------------------------------------------------

      - name: Bundle Rust library - Linux
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_DIR="portix_app/build/linux/x64/release/bundle"

          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::error::Flutter Linux bundle not found:"
            echo "$BUNDLE_DIR"
            exit 1
          fi

          cp \
            "portix_serv_lib/${{ matrix.lib_name }}" \
            "$BUNDLE_DIR/"

          chmod +x \
            "$BUNDLE_DIR/${{ matrix.lib_name }}"

          # Bundle selected system libraries when available.
          BUNDLE_LIB="$BUNDLE_DIR/lib"

          mkdir -p "$BUNDLE_LIB"

          for lib in \
            libsecret-1.so.0 \
            libgcrypt.so.20
          do
            LIB_PATH=$(ldconfig -p 2>/dev/null \
              | grep "$lib" \
              | head -n 1 \
              | awk '{print $NF}')

            if [ -n "$LIB_PATH" ] && [ -f "$LIB_PATH" ]; then
              if [ ! -f "$BUNDLE_LIB/$lib" ]; then
                cp "$LIB_PATH" "$BUNDLE_LIB/$lib"
                echo "Bundled $lib"
              fi
            fi
          done

          echo "✓ Linux Rust library bundled"

      # ----------------------------------------------------------------------
      # Windows
      # ----------------------------------------------------------------------

      - name: Bundle Rust library - Windows
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $src = "portix_serv_lib/${{ matrix.lib_name }}"
          $dst = "portix_app/build/windows/x64/runner/Release/"

          if (-not (Test-Path $src)) {
              Write-Error "Rust library not found: $src"
              exit 1
          }

          if (-not (Test-Path $dst)) {
              Write-Error "Flutter Windows release directory not found: $dst"
              exit 1
          }

          Copy-Item `
            -Path $src `
            -Destination $dst `
            -Force

          Write-Host "✓ Windows Rust library bundled"

      # =========================================================================
      # PACKAGE
      # =========================================================================

      # ----------------------------------------------------------------------
      # macOS ZIP
      # ----------------------------------------------------------------------

      - name: Package macOS
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find \
            portix_app/build/macos/Build/Products/Release \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find macOS app"
            exit 1
          fi

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "portix-macos-${{ github.ref_name }}.zip"

          ls -lah "portix-macos-${{ github.ref_name }}.zip"

      # ----------------------------------------------------------------------
      # Linux TAR
      # ----------------------------------------------------------------------

      - name: Package Linux TAR
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          tar \
            -czf \
            "portix-linux-${{ github.ref_name }}.tar.gz" \
            -C \
            portix_app/build/linux/x64/release \
            bundle

          ls -lah "portix-linux-${{ github.ref_name }}.tar.gz"

      # ----------------------------------------------------------------------
      # Linux DEB
      # ----------------------------------------------------------------------

      - name: Package Linux DEB
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          if [ -f "packaging/linux/build-deb.sh" ]; then
            chmod +x packaging/linux/build-deb.sh

            bash \
              packaging/linux/build-deb.sh \
              "$VERSION"
          else
            echo "::warning::"
            echo "packaging/linux/build-deb.sh not found."
            echo "Skipping DEB package."
          fi

      # ----------------------------------------------------------------------
      # Windows ZIP
      # ----------------------------------------------------------------------

      - name: Package Windows
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $source = "portix_app/build/windows/x64/runner/Release/*"
          $destination = "portix-windows-${{ github.ref_name }}.zip"

          if (-not (Test-Path "portix_app/build/windows/x64/runner/Release")) {
              Write-Error "Windows release directory not found"
              exit 1
          }

          Compress-Archive `
            -Path $source `
            -DestinationPath $destination `
            -Force

          Get-Item $destination

      # =========================================================================
      # UPLOAD DESKTOP ARTIFACT
      # =========================================================================

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: portix-${{ matrix.platform }}-${{ github.ref_name }}

          path: |
            portix-*.zip
            portix-*.tar.gz
            portix-*.deb

          if-no-files-found: error

  # ==========================================================================
  # PHASE 3
  # GITHUB RELEASE - DESKTOP
  #
  # Hanya tag:
  # v1.0.0
  # v1.0.0-beta1
  # ==========================================================================

  release-desktop:
    name: "📦 Release Desktop"

    runs-on: ubuntu-latest

    needs:
      - build-desktop

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          pattern: portix-*-${{ github.ref_name }}
          merge-multiple: true

      - name: Show release artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Release artifacts:"
          find artifacts \
            -type f \
            -maxdepth 3 \
            -print \
            -exec ls -lh {} \;

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_BETA == 'true' }}
          make_latest: ${{ env.IS_BETA != 'true' }}

          name: ${{ env.IS_BETA == 'true' && format('Portix {0} (Beta)', github.ref_name) || format('Portix {0}', github.ref_name) }}

          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.deb

          fail_on_unmatched_files: false

  # ==========================================================================
  # PHASE 4
  # RELEASE NATIVE RUST LIBRARIES
  #
  # Hanya:
  # - Linux
  # - macOS
  # - Windows
  #
  # Tidak Android / iOS.
  # ==========================================================================

  release-libs:
    name: "📚 Release Native Libraries"

    runs-on: ubuntu-latest

    needs:
      - build-rust

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Rust libraries
        uses: actions/download-artifact@v7
        with:
          path: libs/

      - name: Show native libraries
        shell: bash
        run: |
          set -euo pipefail

          echo "Native libraries:"
          find libs \
            -type f \
            -print \
            -exec ls -lh {} \;

      - name: Rename libraries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-libs

          # Linux
          if [ -f "libs/linux-lib/libportix_serv.so" ]; then
            cp \
              "libs/linux-lib/libportix_serv.so" \
              "release-libs/libportix_serv_linux.so"
          fi

          # macOS
          if [ -f "libs/macos-lib/libportix_serv.dylib" ]; then
            cp \
              "libs/macos-lib/libportix_serv.dylib" \
              "release-libs/libportix_serv_macos.dylib"
          fi

          # Windows
          if [ -f "libs/windows-lib/portix_serv.dll" ]; then
            cp \
              "libs/windows-lib/portix_serv.dll" \
              "release-libs/portix_serv_windows.dll"
          fi

          ls -lah release-libs/

      - name: Upload native libraries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_BETA == 'true' }}
          make_latest: ${{ env.IS_BETA != 'true' }}

          files: release-libs/*

          fail_on_unmatched_files: false
