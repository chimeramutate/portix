name: Build & Release

on:
  push:
    branches:
      - main
      - develop
      - staging
      - "release/**"
    tags:
      - "v*.*.*"
      - "v*.*.*-beta*"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "beta"
        type: choice
        options:
          - stable
          - beta
          - development

# Minimal permissions by default.
# Release jobs explicitly request contents: write.
permissions:
  contents: read
  pull-requests: read

env:
  RUST_BACKTRACE: 1

  IS_BETA: ${{ contains(github.ref_name, '-beta') || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'beta') || (github.event_name == 'push' && github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/')) }}

  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}

  IS_MAIN_BRANCH: ${{ github.ref_name == 'main' }}

  BRANCH_NAME: ${{ github.ref_name }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 0: PR VALIDATION
  #
  # Pull Request:
  #   - cargo check
  #   - cargo test
  #
  # No desktop build.
  # No release.
  # No package manager publishing.
  # ═══════════════════════════════════════════════════════════════════════════

  validate-rust:
    name: "✓ Validate Rust [PR]"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    concurrency:
      group: validate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: portix_serv
          key: pr-check

      - name: Check compilation
        working-directory: portix_serv
        run: cargo check --all-features

      - name: Run tests
        working-directory: portix_serv
        run: cargo test --lib --all-features

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 1: BUILD RUST
  #
  # Runs on:
  #   - main
  #   - develop
  #   - staging
  #   - release/*
  #   - version tags
  #   - manual workflow
  #
  # Does NOT run on pull_request.
  #
  # Targets:
  #   - Linux
  #   - macOS
  #   - Windows
  # ═══════════════════════════════════════════════════════════════════════════

  build-rust:
    name: "Rust [${{ matrix.target }}] @ ${{ github.ref_name }}"

    if: github.event_name != 'pull_request'

    runs-on: ${{ matrix.os }}

    concurrency:
      group: build-rust-${{ github.ref_name }}-${{ matrix.target }}
      cancel-in-progress: true

    strategy:
      fail-fast: false

      matrix:
        include:
          # ─────────────────────────────────────────────────────────────────
          # macOS
          # ─────────────────────────────────────────────────────────────────

          - target: macos
            os: macos-latest
            lib_name: libportix_serv.dylib
            output_name: libportix_serv_macos.dylib

          # ─────────────────────────────────────────────────────────────────
          # Linux
          # ─────────────────────────────────────────────────────────────────

          - target: linux
            os: ubuntu-latest
            lib_name: libportix_serv.so
            output_name: libportix_serv_linux.so

          # ─────────────────────────────────────────────────────────────────
          # Windows
          # ─────────────────────────────────────────────────────────────────

          - target: windows
            os: windows-latest
            lib_name: portix_serv.dll
            output_name: libportix_serv_windows.dll

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v6

      # ─────────────────────────────────────────────────────────────────────
      # Rust
      # ─────────────────────────────────────────────────────────────────────

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ─────────────────────────────────────────────────────────────────────
      # Cargo cache
      # ─────────────────────────────────────────────────────────────────────

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: portix_serv
          key: ${{ matrix.target }}

      # ─────────────────────────────────────────────────────────────────────
      # Linux dependencies
      # ─────────────────────────────────────────────────────────────────────

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev

      # ─────────────────────────────────────────────────────────────────────
      # Build Rust
      # ─────────────────────────────────────────────────────────────────────

      - name: Build Rust library
        working-directory: portix_serv
        run: cargo build --profile release-hardened

      # ─────────────────────────────────────────────────────────────────────
      # Strip macOS
      # ─────────────────────────────────────────────────────────────────────

      - name: Strip binary (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -e

          LIB="portix_serv/target/release-hardened/${{ matrix.lib_name }}"

          if [ -f "$LIB" ]; then
            strip -x "$LIB"
            echo "✓ Stripped $LIB"
          else
            echo "::warning::Binary not found: $LIB"
          fi

      # ─────────────────────────────────────────────────────────────────────
      # Strip Linux
      # ─────────────────────────────────────────────────────────────────────

      - name: Strip binary (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -e

          LIB="portix_serv/target/release-hardened/${{ matrix.lib_name }}"

          if [ -f "$LIB" ]; then
            strip --strip-all "$LIB"
            echo "✓ Stripped $LIB"
          else
            echo "::warning::Binary not found: $LIB"
          fi

      # ─────────────────────────────────────────────────────────────────────
      # Prepare artifact
      # ─────────────────────────────────────────────────────────────────────

      - name: Prepare artifact
        shell: bash
        run: |
          set -e

          mkdir -p dist

          SOURCE="portix_serv/target/release-hardened/${{ matrix.lib_name }}"

          if [ ! -f "$SOURCE" ]; then
            echo "::error::Rust library not found: $SOURCE"
            exit 1
          fi

          cp "$SOURCE" "dist/${{ matrix.lib_name }}"

          echo "Build artifact:"
          ls -lh dist/

      # ─────────────────────────────────────────────────────────────────────
      # Security scan
      # ─────────────────────────────────────────────────────────────────────

      - name: Trivy scan - built artifact
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: dist/
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      # ─────────────────────────────────────────────────────────────────────
      # Upload Rust library
      # ─────────────────────────────────────────────────────────────────────

      - name: Upload Rust library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-lib
          path: dist/${{ matrix.lib_name }}
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 2: DESKTOP APPLICATION
  #
  # Runs after Rust builds.
  #
  # Platforms:
  #   - macOS
  #   - Linux
  #   - Windows
  #
  # Skipped for Pull Requests.
  # ═══════════════════════════════════════════════════════════════════════════

  build-desktop:
    name: "Desktop [${{ matrix.platform }}] @ ${{ github.ref_name }}"

    if: github.event_name != 'pull_request'

    needs:
      - build-rust

    runs-on: ${{ matrix.os }}

    concurrency:
      group: build-desktop-${{ github.ref_name }}-${{ matrix.platform }}
      cancel-in-progress: true

    strategy:
      fail-fast: false

      matrix:
        include:
          # ─────────────────────────────────────────────────────────────────
          # macOS
          # ─────────────────────────────────────────────────────────────────

          - platform: macOS
            os: macos-latest
            flutter_target: macos
            rust_lib_artifact: macos-lib
            lib_name: libportix_serv.dylib

          # ─────────────────────────────────────────────────────────────────
          # Linux
          # ─────────────────────────────────────────────────────────────────

          - platform: Linux
            os: ubuntu-latest
            flutter_target: linux
            rust_lib_artifact: linux-lib
            lib_name: libportix_serv.so

          # ─────────────────────────────────────────────────────────────────
          # Windows
          # ─────────────────────────────────────────────────────────────────

          - platform: Windows
            os: windows-latest
            flutter_target: windows
            rust_lib_artifact: windows-lib
            lib_name: portix_serv.dll

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v6

      # ─────────────────────────────────────────────────────────────────────
      # Download Rust library
      # ─────────────────────────────────────────────────────────────────────

      - name: Download Rust library
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.rust_lib_artifact }}
          path: portix_serv_lib/

      # ─────────────────────────────────────────────────────────────────────
      # Setup Flutter
      # ─────────────────────────────────────────────────────────────────────

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ─────────────────────────────────────────────────────────────────────
      # Flutter dependencies
      # ─────────────────────────────────────────────────────────────────────

      - name: Get Flutter dependencies
        working-directory: portix_app
        run: flutter pub get

      # ─────────────────────────────────────────────────────────────────────
      # Verify Flutter Rust Bridge
      # ─────────────────────────────────────────────────────────────────────

      - name: Verify bridge codegen hash
        shell: bash
        run: |
          set -euo pipefail

          DART_HASH=$(
            sed -n \
              's/.*int get rustContentHash => \(-\?[0-9]*\);/\1/p' \
              portix_app/lib/src/rust/frb_generated.dart
          )

          RUST_HASH=$(
            sed -n \
              's/.*FLUTTER_RUST_BRIDGE_CODEGEN_CONTENT_HASH: i32 = \(-\?[0-9]*\);/\1/p' \
              portix_serv/src/frb_generated.rs
          )

          echo "Dart content hash: $DART_HASH"
          echo "Rust content hash: $RUST_HASH"

          if [ -z "$DART_HASH" ]; then
            echo "::error::Could not find Dart Rust Bridge content hash"
            exit 1
          fi

          if [ -z "$RUST_HASH" ]; then
            echo "::error::Could not find Rust Rust Bridge content hash"
            exit 1
          fi

          if [ "$DART_HASH" != "$RUST_HASH" ]; then
            echo "::error::Content hash mismatch!"
            echo "::error::Dart ($DART_HASH) != Rust ($RUST_HASH)"
            echo "Run flutter_rust_bridge_codegen to synchronize the generated code."
            exit 1
          fi

          echo "✓ Flutter Rust Bridge hashes match"

      # ─────────────────────────────────────────────────────────────────────
      # Build Flutter
      # ─────────────────────────────────────────────────────────────────────

      - name: Build Flutter app
        working-directory: portix_app
        run: |
          flutter build ${{ matrix.flutter_target }} --release \
            --dart-define=PORTIX_BACKEND=rust \
            --dart-define=RUST_LIBRARY_MODE=production

      # ═══════════════════════════════════════════════════════════════════════
      # Bundle Rust library
      # ═══════════════════════════════════════════════════════════════════════

      - name: Bundle library - macOS
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -e

          APP_PATH=$(
            find portix_app/build/macos/Build/Products/Release \
              -maxdepth 1 \
              -name "*.app" \
              -type d \
              | head -n 1
          )

          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find macOS .app bundle"
            exit 1
          fi

          cp \
            "portix_serv_lib/${{ matrix.lib_name }}" \
            "$APP_PATH/Contents/MacOS/"

          codesign \
            --force \
            --sign - \
            "$APP_PATH/Contents/MacOS/${{ matrix.lib_name }}"

          codesign \
            --force \
            --deep \
            --sign - \
            "$APP_PATH"

          echo "✓ Rust library bundled and codesigned"

      - name: Bundle library - Linux
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -e

          BUNDLE_DIR="portix_app/build/linux/x64/release/bundle"

          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::error::Linux Flutter bundle not found"
            exit 1
          fi

          cp \
            "portix_serv_lib/${{ matrix.lib_name }}" \
            "$BUNDLE_DIR/"

          chmod +x \
            "$BUNDLE_DIR/${{ matrix.lib_name }}"

          # Optional system libraries.
          BUNDLE_LIB="$BUNDLE_DIR/lib"
          mkdir -p "$BUNDLE_LIB"

          for lib in \
            libsecret-1.so.0 \
            libgcrypt.so.20
          do
            LIB_PATH=$(
              ldconfig -p |
              grep "$lib" |
              head -n 1 |
              awk '{print $NF}'
            )

            if [ -n "$LIB_PATH" ] && [ ! -f "$BUNDLE_LIB/$lib" ]; then
              cp "$LIB_PATH" "$BUNDLE_LIB/$lib"
              echo "Bundled $lib"
            fi
          done

          echo "✓ Linux Rust library bundled"

      - name: Bundle library - Windows
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $src = "portix_serv_lib/${{ matrix.lib_name }}"
          $dst = "portix_app/build/windows/x64/runner/Release/"

          if (-not (Test-Path $src)) {
            Write-Error "Rust library not found: $src"
            exit 1
          }

          if (-not (Test-Path $dst)) {
            Write-Error "Windows Flutter release directory not found: $dst"
            exit 1
          }

          Copy-Item `
            -Path $src `
            -Destination $dst `
            -Force

          Write-Host "✓ Windows Rust library bundled"

      # ═══════════════════════════════════════════════════════════════════════
      # Package applications
      # ═══════════════════════════════════════════════════════════════════════

      - name: Package app - macOS
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -e

          APP_PATH=$(
            find portix_app/build/macos/Build/Products/Release \
              -maxdepth 1 \
              -name "*.app" \
              -type d \
              | head -n 1
          )

          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find macOS .app bundle"
            exit 1
          fi

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "portix-macos-${{ github.ref_name }}.zip"

      - name: Package app - Linux
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -e

          tar -czf \
            "portix-linux-${{ github.ref_name }}.tar.gz" \
            -C portix_app/build/linux/x64/release \
            bundle

      - name: Package app - Linux DEB
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -e

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          bash packaging/linux/build-deb.sh "$VERSION"

      - name: Package app - Windows
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $destination = "portix-windows-${{ github.ref_name }}.zip"

          Compress-Archive `
            -Path "portix_app/build/windows/x64/runner/Release/*" `
            -DestinationPath $destination `
            -Force

          Write-Host "✓ Created $destination"

      # ─────────────────────────────────────────────────────────────────────
      # Upload application artifacts
      # ─────────────────────────────────────────────────────────────────────

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: portix-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            portix-*-${{ github.ref_name }}.*
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 3: GITHUB RELEASE
  #
  # Only version tags.
  #
  # Examples:
  #   v1.0.0
  #   v1.2.3
  #   v2.0.0-beta1
  # ═══════════════════════════════════════════════════════════════════════════

  release-desktop:
    name: "📦 Release Desktop to GitHub"

    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - build-desktop

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          pattern: portix-*-${{ github.ref_name }}
          merge-multiple: false

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_BETA == 'true' }}
          make_latest: ${{ env.IS_BETA != 'true' }}

          name: >-
            ${{ env.IS_BETA == 'true'
              && format('Portix {0} (Beta)', github.ref_name)
              || format('Portix {0}', github.ref_name)
            }}

          files: |
            artifacts/**/*.*

          fail_on_unmatched_files: false

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 4: RELEASE NATIVE LIBRARIES
  #
  # Linux:
  #   .so
  #
  # macOS:
  #   .dylib
  #
  # Windows:
  #   .dll
  # ═══════════════════════════════════════════════════════════════════════════

  release-libs:
    name: "📚 Release Native Libraries"

    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - build-rust

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all Rust libraries
        uses: actions/download-artifact@v7
        with:
          path: libs/

      - name: Prepare release libraries
        shell: bash
        run: |
          set -e

          mkdir -p release-libs

          find libs \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.dll" \
              -o -name "*.dylib" \
            \) \
            -exec cp {} release-libs/ \;

          echo "Release libraries:"
          ls -lh release-libs/

      - name: Upload native libraries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_BETA == 'true' }}
          make_latest: ${{ env.IS_BETA != 'true' }}

          files: |
            release-libs/*

          fail_on_unmatched_files: false

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 5: SNAP
  #
  # Only version tags.
  # Stable tags are published to Snap Store.
  # Beta tags are built but not published as stable.
  # ═══════════════════════════════════════════════════════════════════════════

  snap:
    name: "📦 Build Snap"

    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - build-desktop

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync snapcraft version
        shell: bash
        run: |
          set -e

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          SNAPCRAFT_FILE="snap/snapcraft.yaml"

          if ! grep -qE '^version:' "$SNAPCRAFT_FILE"; then
            sed -i \
              "/^name:/a version: \"${VERSION}\"" \
              "$SNAPCRAFT_FILE"
          else
            sed -i \
              "s/^version:.*/version: \"${VERSION}\"/" \
              "$SNAPCRAFT_FILE"
          fi

          echo "Snap version: $VERSION"

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: snap

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: portix-snap-${{ github.ref_name }}
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

      - name: Publish to Snap Store
        if: env.IS_BETA != 'true'
        continue-on-error: true
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN }}

      - name: Upload Snap to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_BETA == 'true' }}
          make_latest: ${{ env.IS_BETA != 'true' }}
          files: ${{ steps.snap.outputs.snap }}

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 6: FLATPAK
  #
  # Only Linux release.
  # ═══════════════════════════════════════════════════════════════════════════

  flatpak:
    name: "📦 Build Flatpak"

    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - build-desktop

    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux bundle
        uses: actions/download-artifact@v7
        with:
          name: portix-Linux-${{ github.ref_name }}
          path: artifact/

      - name: Extract Linux bundle
        shell: bash
        run: |
          set -e

          mkdir -p flatpak/bundle-src

          tar -xzf \
            "artifact/portix-linux-${{ github.ref_name }}.tar.gz" \
            -C flatpak/bundle-src \
            --strip-components=1

      - name: Copy desktop assets
        shell: bash
        run: |
          set -e

          mkdir -p flatpak/assets

          cp \
            assets/icons/portix_launcher.png \
            flatpak/assets/

          cp \
            flatpak/com.github.asepimam.Portix.desktop \
            flatpak/assets/

          cp \
            flatpak/com.github.asepimam.Portix.metainfo.xml \
            flatpak/assets/

      - name: Validate icon
        shell: bash
        run: |
          set -e

          python3 -c "
          import struct

          icon = 'flatpak/assets/portix_launcher.png'

          with open(icon, 'rb') as f:
              data = f.read(33)

          if data[:8] != b'\\x89PNG\\r\\n\\x1a\\n':
              raise ValueError('Icon is not a valid PNG')

          width, height = struct.unpack('>II', data[16:24])

          if width != height:
              raise ValueError(
                  f'Icon is {width}x{height}; icon must be square'
              )

          print(f'✓ Icon {width}x{height} is square')
          "

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: portix-${{ github.ref_name }}.flatpak
          manifest-path: flatpak/com.github.asepimam.Portix.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: portix-flatpak-${{ github.ref_name }}
          path: portix-${{ github.ref_name }}.flatpak
          if-no-files-found: error

      - name: Upload Flatpak to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_BETA == 'true' }}
          make_latest: ${{ env.IS_BETA != 'true' }}
          files: portix-${{ github.ref_name }}.flatpak

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 7: FLATHUB
  #
  # Stable releases only.
  #
  # Beta:
  #   Build Flatpak
  #   DO NOT publish to Flathub
  #
  # Stable:
  #   Update Flathub manifest
  #   Push changes
  # ═══════════════════════════════════════════════════════════════════════════

  publish-flathub:
    name: "🚀 Publish to Flathub (stable only)"

    if: >
      startsWith(github.ref, 'refs/tags/')
      && !contains(github.ref_name, '-beta')

    needs:
      - flatpak

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v6
        with:
          path: portix

      - name: Checkout Flathub repository
        uses: actions/checkout@v6
        with:
          repository: flathub/com.github.asepimam.Portix
          token: ${{ secrets.FLATHUB_PAT }}
          path: flathub-repo

      - name: Download Linux bundle
        uses: actions/download-artifact@v7
        with:
          name: portix-Linux-${{ github.ref_name }}
          path: artifact/

      - name: Compute release hash and URL
        id: vars
        shell: bash
        run: |
          set -e

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          ARCHIVE="artifact/portix-linux-${{ github.ref_name }}.tar.gz"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Linux archive not found: $ARCHIVE"
            exit 1
          fi

          SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')

          URL="https://github.com/Asepimam/portix/releases/download/${{ github.ref_name }}/portix-linux-${{ github.ref_name }}.tar.gz"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "SHA256: $SHA256"
          echo "URL: $URL"

      - name: Update Flathub manifest
        shell: bash
        run: |
          set -e

          MANIFEST="flathub-repo/com.github.asepimam.Portix.yml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Flathub manifest not found: $MANIFEST"
            exit 1
          fi

          python3 \
            "$MANIFEST" \
            "${{ steps.vars.outputs.url }}" \
            "${{ steps.vars.outputs.sha256 }}" \
            <<'PYEOF'
          import sys
          import re

          manifest_path = sys.argv[1]
          url = sys.argv[2]
          sha256 = sys.argv[3]

          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          content, url_count = re.subn(
              r"url:\s*.*portix-linux.*\.tar\.gz",
              f"url: {url}",
              content,
          )

          if url_count == 0:
              raise SystemExit(
                  "Could not find Linux archive URL in Flathub manifest"
              )

          content, hash_count = re.subn(
              r"(sha256:\s*)[a-fA-F0-9]{64}",
              rf"\g<1>{sha256}",
              content,
          )

          if hash_count == 0:
              raise SystemExit(
                  "Could not find SHA256 in Flathub manifest"
              )

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("✓ Flathub manifest updated")
          PYEOF

      - name: Check Flathub changes
        shell: bash
        run: |
          cd flathub-repo

          git diff --check

          if git diff --quiet; then
            echo "No Flathub changes detected."
          else
            echo "Flathub changes:"
            git diff -- com.github.asepimam.Portix.yml
          fi

      - name: Commit and push to Flathub
        shell: bash
        run: |
          set -e

          cd flathub-repo

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "portix-release-bot"
          git config user.email "actions@users.noreply.github.com"

          git add com.github.asepimam.Portix.yml

          git commit \
            -m "Update to ${{ github.ref_name }}"

          git push origin HEAD

          echo "✓ Flathub manifest pushed"
