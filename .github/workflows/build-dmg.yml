name: Build DMG

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-dmg:
    runs-on: macos-latest
    strategy:
      matrix:
        # Uncomment to support multiple architectures
        # arch: [x64, arm64]
        arch: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          architecture: ${{ matrix.arch }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup OpenSSL
        run: |
          brew install openssl

      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path:
            - ~/.pub-cache
            - ${{ env.HOME }}/Library/Caches/flutter
            - ${{ env.HOME }}/Library/Flutter
          key: ${{ runner.OS }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys:
            - ${{ runner.OS }}-flutter-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/portix_serv/target
          key: ${{ runner.OS }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.OS }}-cargo-

      - name: Get Version
        id: get_version
        run: |
          # Get version from tag or use default
          if [[ ${{ startsWith(github.ref, 'refs/tags') }} == "true" ]]; then
            VERSION=${{ github.ref_name }}
            # Remove 'v' prefix if present
            VERSION=${VERSION#v}
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION"

      - name: Build DMG
        run: |
          chmod +x packaging/dmg/build_dmg.sh
          ./packaging/dmg/build_dmg.sh ${{ steps.get_version.outputs.version }}

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portix-${{ steps.get_version.outputs.version }}-macos-dmg
          path: dist/Portix-${{ steps.get_version.outputs.version }}.dmg
          if-no-files-found: error

      - name: Upload DMG Checksum Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portix-${{ steps.get_version.outputs.version }}-macos-checksum
          path: dist/Portix-${{ steps.get_version.outputs.version }}.dmg.sha256
          if-no-files-found: error

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portix-${{ steps.get_version.outputs.version }}-macos-zip
          path: dist/Portix-${{ steps.get_version.outputs.version }}.zip
          if-no-files-found: error

      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags')
        uses: softprops/action-gh-release@v2
        with:
          name: Portix ${{ steps.get_version.outputs.version }}
          body: |
            ## Portix ${{ steps.get_version.outputs.version }}
            
            ### Features
            - Multi-tab terminal sessions
            - Split workspace
            - Built-in SFTP file manager
            - Remote file browsing
            - Command autocomplete
            - Native Rust SSH engine
            
            ### Download
            - [macOS DMG](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Portix-${{ steps.get_version.outputs.version }}.dmg)
          files: |
            dist/Portix-${{ steps.get_version.outputs.version }}.dmg
            dist/Portix-${{ steps.get_version.outputs.version }}.dmg.sha256
            dist/Portix-${{ steps.get_version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}